[package]
name = "r-code-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "R-Code Host：主进程、IPC Server、进程编排"

[[bin]]
name = "r-code-host"
path = "src/main.rs"

[dependencies]
# 公共合同
hermes-core = { workspace = true }
hermes-error = { workspace = true }
hermes-ipc = { workspace = true }
hermes-config = { workspace = true }
hermes-tauri = { workspace = true }
hermes-store = { workspace = true }
hermes-llm = { workspace = true }

# 产品私有
r-code-core = { workspace = true }
r-code-store = { workspace = true }
r-code-gateway = { workspace = true }
r-code-terminal = { workspace = true }
r-code-agent-worker = { workspace = true }
r-code-mcp = { workspace = true }

# SQLite（启动期恢复 / 支持包直接访问，不走连接池）
rusqlite = { workspace = true }

# 异步
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# 工具
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
blake3 = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }

# Tauri 桌面应用壳
tauri = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = "2"
anyhow = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Finder 启动的 macOS GUI 应用不会继承登录 shell 的 PATH。固定到已审核的 Tauri
# helper revision，确保 Homebrew/npm/nvm 安装的 Codex CLI 与 Node.js 能被发现。
[target.'cfg(target_os = "macos")'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
# 约束 fix-path-env 的传递依赖，保持 workspace 声明的 Rust 1.80 最低版本。
home = "=0.5.9"

[build-dependencies]
tauri-build = { workspace = true }
