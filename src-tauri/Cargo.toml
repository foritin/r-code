[package]
name = "r-code-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "R-Code Host：主进程、IPC Server、进程编排"

[[bin]]
name = "r-code-host"
path = "src/main.rs"

[dependencies]
# 公共合同
hermes-core = { workspace = true }
hermes-error = { workspace = true }
hermes-ipc = { workspace = true }
hermes-config = { workspace = true }
hermes-tauri = { workspace = true }
hermes-store = { workspace = true }
hermes-llm = { workspace = true }

# 产品私有
r-code-core = { workspace = true }
r-code-store = { workspace = true }
r-code-gateway = { workspace = true }
r-code-terminal = { workspace = true }
r-code-agent-worker = { workspace = true }
r-code-mcp = { workspace = true }

# SQLite（启动期恢复 / 支持包直接访问，不走连接池）
rusqlite = { workspace = true }

# 异步
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# 工具
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
dirs = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }

# Tauri 桌面应用壳
# Tauri's build-script allowlist validates this feature from the top-level dependency declaration
# whenever `tauri.macos.conf.json` enables `macOSPrivateApi`; target-scoped features are ignored.
tauri = { workspace = true, features = ["macos-private-api"] }
tauri-plugin-updater = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-opener = "2"
anyhow = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# 托盘隐藏后再次从桌面/任务栏启动时，唤回已有窗口而不是创建第二个数据库进程。
tauri = { workspace = true, features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
zip = { workspace = true }
# Text-only models can still accept screenshots through Windows' on-device OCR.
# Keep the WinRT surface target-scoped so non-Windows builds do not compile these bindings.
windows = { version = "0.61.3", features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }

# Finder 启动的 macOS GUI 应用不会继承登录 shell 的 PATH。固定到已审核的 Tauri
# helper revision，确保 Homebrew/npm/nvm 安装的 Codex CLI 与 Node.js 能被发现。
[target.'cfg(target_os = "macos")'.dependencies]
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", rev = "c4c45d503ea115a839aae718d02f79e7c7f0f673" }
# 约束 fix-path-env 的传递依赖，保持 workspace 声明的 Rust 1.80 最低版本。
home = "=0.5.9"
# 验证固定 Applications 目录下桌面 bundle 的 ID、OpenAI Team ID 与完整代码签名；
# 不会扫描或执行 bundle 中除 Contents/Resources/codex 之外的任意路径。
plist = "1.10"
core-foundation = "0.10"
security-framework = "3.7"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSProcessInfo", "NSString"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler"] }

[build-dependencies]
tauri-build = { workspace = true }
