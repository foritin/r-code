schema_version: ai-task-packet.v1
project_id: remote-control
task_id: RA1
status: active

source:
  document: docs/prd/remote-control/worklist.md
  refs:
    - docs/prd/remote-control/worklist.md#RA1-审批-pending-op-持久化与事件外发
    - docs/prd/remote-control/architecture.md#6-命令与事件复用既有协议

objective: 审批 pending op 持久化与事件外发——journal 出现 approval.requested/decided；阻塞中的插件调用在决策（或超时拒绝）后继续；daemon 重启后未决 op 从事件重建。
depends_on: []
fixed_constraints:
  - op id 只能宿主生成/校验；插件自造 id 拒绝（RpcError，不产生事件）
  - 事件与 assistant.message 同通道（task.events，payload.journalKind 判别）
  - 无人连接时 op 保持 pending；默认决策超时 300s 后 Denied 并记事件（RunManager 构造可配）
  - 同 op 重复 request 幂等返回等待中的同一个决策
  - 迟到/重复/冲突决策：第一次有效，同决策重放原结果、异决策拒绝

steps:
  - id: RA1.S1
    status: completed
    action: 预检——cargo check/clippy 绿；router.rs:383 语义、ApprovalRegistry 调用点（仅 t10）、compose 调用方（签名不变零波及）已核实。
    expected_result: 基线绿 ✅
  - id: RA1.S2
    status: in_progress
    action: 契约冻结——requested {opId,summary,runId,createdSeq}（task_id 走事件列）；decided {opId,decision,decidedBy,decidedSeq,runId}；createdSeq/decidedSeq=写入前 journal 水位（事件无法自引用自身 seq）；EventKind::ApprovalRaised。
    expected_result: approval_store.rs + envelope_of 映射
  - id: RA1.S3
    status: pending
    action: ApprovalStore（tokio Mutex 串行化；先写 journal 再提交内存——决策生效⟹事件已持久）+ router request 分支重写 + RunManager/application 装配。
    expected_result: 编译绿
  - id: RA1.S4
    status: pending
    action: 测试 ra1_persistent_approvals.rs（A1 时序阻塞+granted 续行；A2 重启重建+冲突拒绝；A3 未登记 RpcError 无事件；超时 Denied）+ t10 契约演进更新。
    expected_result: 全绿
  - id: RA1.S5
    status: pending
    action: 回归 harness_conformance/conversation_engine/t32 + clippy/fmt + verify-remote --task RA1 注册 + 证据归档。
    expected_result: --task RA1 退出 0

acceptance_assertions:
  - { id: RA1.A1, level: integration, status: pending }
  - { id: RA1.A2, level: reliability, status: pending }
  - { id: RA1.A3, level: security-negative, status: pending }

completed_assertions: []
remaining_assertions: [RA1.A1, RA1.A2, RA1.A3]
changed_paths: []
decisions:
  - DM1: created_seq/decided_seq 冻结为"事件写入前的 journal 水位"（max_event_seq）——append-only 事件无法自引用自身 seq；单调可比，满足 RA2 list 排序需求。
  - DM2: JournalStore trait 加默认方法 max_event_seq（默认全量读 last），V2Store 用 SELECT MAX(seq) 覆盖，MemoryJournal 覆盖——生产路径一次 SQL。
  - DM3: ApprovalStore 内部 tokio::sync::Mutex 串行化 register/decide/pending/rebuild；decide 先写 journal 成功再提交内存+watch 发送（决策生效⟹已持久）；并发重复 decided 事件在 rebuild 投影时 first-wins 去重。
  - DM4: t10 契约演进——未登记 op 从"返回 denied 决策"升级为"PROTOCOL_VIOLATION RpcError、不产生事件"（拒绝语义不削弱且更强）；宿主决策路径 set_decision 改为 register+decide。
  - DM5: 等待原语 watch::Sender<Option<DecisionRecord>>——"先注册等待者后决策"与"决策早于等待者"两时序都覆盖。
attempts: 1
evidence: []
