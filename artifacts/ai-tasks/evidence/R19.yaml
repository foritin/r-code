  reason: >
    R19.A1/A2 死锁（测试永久挂起，--through R6 随之卡死 18 分钟无输出）。
    根因：crates/r-code-relay/src/e2ee.rs 的 drain_control 在 owner adopt 后预读
    一个帧来吸收 owner.bind.ack，但 WebSocket 没有 peek——预读若抢到 Noise 握手
    msg1（Binary），该帧被 next() 消费后即丢弃，owner 永远等不到 msg1、device 永远
    等 msg2，双方互等。R17 因测试里 100ms sleep 使 ack 先到、msg1 后到而偶然躲过；
    R19 的 duplex 桥中 device 立即拨号，必触雷。同一份代码还带 E0733（递归 async fn），
    连带让 r-code-relay 无法编译，所以该缺陷此前从未真正跑起来。
  fix: >
    删除 drain_control 与 accept_owner 中的预读调用；改由握手自身的帧循环吸收控制帧——
    next_binary 对白名单内的良性控制帧（owner.bind.ack，内容为空语义）continue 跳过，
    其余 Text 帧仍按"控制帧即握手失败"处理（恶意中继注入不放松）。
