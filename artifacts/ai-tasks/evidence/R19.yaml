decisions:
  - DM133: 【复验修复】握手前不预读帧。owner.bind.ack 由 next_binary 白名单跳过
    （BENIGN_CONTROL_TYPES），而不是在握手前用 timeout(150ms) 抢读——预读会吞掉
    device 已发出的 Noise msg1 造成双端互等；删除 drain_control 而非改写它，
    因为 WebSocketStream 没有 peek/回放，任何"先读一帧"的方案性质上都不可靠。
  - DM107: 【实现中修复】relay supersede 竞态——旧 owner 连接 retire 时无条件 remove(owner_id) 会删掉新连接的 entry（data_tx drop → 新桥死亡）；OwnerEntry 加 generation，retire 仅删除自身代际。
  - DM108: 【协议 v1.1】owner.bind 增加 ack 帧——console 可时序化"先绑定后设备拨入"，消除 admission 竞态（已写回 relay-interface.md）。
  - DM109: 【实现中修复】E2eeStream 硬编码 MaybeTlsStream<TcpStream> → 泛型 <S>，duplex（测试）与 TLS（生产）同用；poll_write 直写 Sink（start_send 同步入队 + poll_flush 驱动），避免 async 块 Pending 被 drop 丢数据。
  - DM110: 【测试修复】duplex 桥的 accept_async 先于 client_async 顺序 await 会死锁（等对方 upgrade 请求）——responder 侧 spawn 化（与 A1 responder 同模式）。
  - DM111: R19 测试用内存 duplex 对接 E2EE 两端——relay 转发平面由 R16 验证、E2EE 握手由 R17 验证，此处聚焦"桥上应用协议 + 纵深吊销"，消除 socket 时序噪音。
  - DM112: 连接策略（直连优先/回落/强制中继）为 TS core 模块（PWA/RN 共享，R21 抽包）；Rust 侧 RelayTransport 的拨号编排对接该语义（R19 卡的 PWA 验证路径）。
