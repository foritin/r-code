decisions:
  - DM11: 声明式扩展放 sidecar 文件 provider-decls.toml 而非 config.toml 新表 —— vendor Config 的 save_global 每次全量序列化会丢弃未知表；sidecar 由 R-Code 独占读写，round-trip 无损。
