# 补记（交互 TUI 落地后的安装/脚本收尾）
- DM85: dev-tui.ps1 启动脚本（精简 dev.ps1：仅工具链 + 子模块同步 + cargo build/run；默认 data-dir 指向 dev GUI 同一 AppData，TUI 复用 dev 里配好的 provider）；-Print/-Json 非交互单轮。
- DM86: 修复 installer-hooks.nsh 的 PATH 写入——原 Environ::SetVar 依赖 NSIS Environ 插件，但 Tauri NSIS 模板未内置该插件（打包会报 Invalid command）；改为纯内置指令 ReadRegStr/WriteRegExpandStr + StrLoc 去重，安装写用户 PATH（去重防升级重复）、卸载移除（$INSTDIR 前后拼接 + 去分隔符），全程非致命。
- DM87: 修复 r-code-tui Windows 控制台 UTF-8——Windows 默认代码页 936(GBK)，TUI 的模型回复/IME 中文会整屏乱码；main 入口 SetConsoleOutputCP/SetConsoleCP(65001)；dev-tui.ps1 侧再设 Console.OutputEncoding=UTF8 使 PowerShell 正确解码子进程 stdout。
