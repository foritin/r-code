decisions:
  - DM81: build.rs 占位机制：externalBin 产物缺失时写文本占位（满足 tauri-build 存在性检查），发布管线先构建真实 CLI 覆盖——本地 cargo build/test 不破坏，误打包占位会在安装期立即暴露（文本非可执行镜像）。
  - DM82: release.yml 在 tauri-action 前加 Build r-code-tui CLI for bundling 步（matrix.rust-target 对齐，Windows 补 .exe 后缀）——三平台同一顺序。
  - DM83: macOS/Linux PATH 接入（符号链接/deb /usr/bin）由各平台打包脚本后续增量；Windows 用户级 PATH（占用户绝大多数）本任务落地（钩子非致命语义已验证）。
