decisions:
  - DM22: 定价数据源 = provider-decls.toml 的 [decls.<name>.cost]（tier 表键成层名、费率平铺四桶、thinking_level_map+hidden_thinking_levels）——不硬编码不确定的厂商价格；目录预设无声明定价即无 cost_usd（不臆造）。PRD 决策空间"定价放 provider 模型描述"落为声明侧模型级配置。
  - DM23: thinking_level_map 三态在 TOML 无 null 值的约束下拆成两个键：thinking_level_map（字符串映射；档位缺省=省略态）+ hidden_thinking_levels（null 档），语义与 PRD 一致。
  - DM24: 归因接线点 = 原生线路 persist_native_usage_event（run.model → 声明匹配 → cost_usd 并入 usage_json 列）；Codex 线路模型不经声明目录，无定价不动（行为不变）。
  - DM25: 无归因且无 retries 合并时 usage_json 原样透传——serde_json 无 preserve_order，重序列化会变键序破坏既有逐字节断言；"未启用零行为变化"原则优先。
  - DM26: DeclCost 经 serde try_from=DeclCostRaw 在 load 时校验费率非负有限；ProviderDecl/DeclFile 因 f64 费率从 Eq 降为 PartialEq。

