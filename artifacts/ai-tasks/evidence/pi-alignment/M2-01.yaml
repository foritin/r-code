decisions:
  - DM27: 评估框架落独立 crate r-code-evals（PRD 决策空间选项一）——plan_eval 是 Plan 三臂专用 bin（含 preregistration/成本审计等重型合同），通用行为评估复用其模式而非其本体。
  - DM28: 同源工厂 = CommandState::new_with_planning_release_control（与桌面/plan_eval 同一装配入口）；驱动链 = task_create → task_set_inference → install_mock_scenario → agent_send → 轮询 settle → task_detail（全部既有 pub API，仅 bridge_for 改 pub + 新增 install_mock_scenario 一个注入点）。
  - DM29: 可复现性用 Mock runtime + 脚本化场景（ScenarioSource）——评估的确定性等价物仍走完整 host 管线（drain 循环、事件 sink、usage 落库）；真实模型运行属外部放行（§11.3）。install_mock_scenario 对真实线路返回 false（拒绝脚本化），harness 据此硬失败。
  - DM30: 隔离检查的 MCP 判据 = "无 enabled server"而非"零 server"——McpSettingsService.load 的 reconcile_builtin 会无条件补回内置 r-code-research（禁用态、不拉进程），禁用内置条目不构成隔离破坏；eval config 显式写 disabled 条目使状态稳定。
  - DM31: 事件捕获用 CommandState.agent_event_sink（emit_agent_event 广播面）而非 poll 竞争——与宿主观测同一条链路。

external_gates_remaining:
