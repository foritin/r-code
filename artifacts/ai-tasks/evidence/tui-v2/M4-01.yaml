decisions:
  - DM1: 换行键集 = Shift+Enter + Ctrl+J（crossterm 两者的修饰符/键码都可靠）；`\\`+Enter 不实现（与字面反斜杠歧义）。
  - DM2: undo 粒度 = 每个变更动作一快照（insert_str 整段一快照），上限 200；take 也入栈（发送后可找回）。
  - DM3: grapheme 边界用 unicode-segmentation（grapheme_indices 的字节索引必须换算 char 索引再与光标比较——首版混用导致 CJK 退格清空全缓冲，已修并有回归测试覆盖）。
  - DM4: 词定义 = 字母数字/下划线/CJK 连续段（空格与标点是边界）。
  - DM5: 输入区自动增高 = wrap_lines(宽-2) 行数 + 2 边框，上限 10 行。
external_gates_remaining:
  - Shift+Enter 在部分终端映射为 Enter（无 SHIFT 修饰）——Windows Terminal/iTerm2 实测（Ctrl+J 为回退键）
