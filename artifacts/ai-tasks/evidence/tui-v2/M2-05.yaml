decisions:
  - DM1: 审批接管语义：pending 存在时键位被审批契约接管且必须决策（y/a=决策，esc/ctrl-c=拒绝，无"忽略关闭"路径）——避免审批卡被 Esc 顺手关掉后工具调用悬挂。
  - DM2: `a` = 宿主 AllowAlways（本任务级 standing rule；R3/R4 由宿主 add_standing_rule 拒绝——语义如实，不实现 codex 的命令前缀粒度，前缀放行为宿主未来扩展，浮层措辞用"本任务内不再询问"）。
  - DM3: 请求泵 = PermissionEngine.subscribe_requests() broadcast → TuiState 投影；决策经 engine.decide(request_id)（v1 approval.rs 的 ApprovalDecision 意图链与 MC-5 合同对齐）。
  - DM4: 带面渲染先于其他浮层（审批优先级最高；模型/思考浮层在审批期间不可达——键位已被接管）。
