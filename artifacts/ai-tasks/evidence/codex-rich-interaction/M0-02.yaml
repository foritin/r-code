  - raw reasoning（item/reasoning/textDelta 与 reasoning.content）只产生 ReasoningRawDropped 诊断；bare "requestUserInput" 旧名→LegacyName 诊断不按新合同解释
  - scope：thread 未建立/缺 threadId/turnId、异线程异 turn 全部 fail-closed（计数不投事件）；陈旧 turn/completed 不清除活动 turn
  - request id 关联统一 wire_request_id（数字→十进制、字符串→去引号），requestUserInput 与 serverRequest/resolved 同构关联
  - 方法表对齐：codex_app_server.rs recognized_protocol_progress 委托 codex_interaction::is_recognized_protocol_progress（旧 15 方法超集，既有 28 个 transport 测试保持通过）
  - 有界：delta 16k/权威文本 200k/工具字段 8k/diff 128k/计划 256 步/问题 32×选项 32；超限截断或拒绝 + 诊断，后续帧继续处理

