decisions:
  - 类型落点：src-tauri/src/codex_interaction.rs（host 内、仅依赖 serde_json + r-code-core::secret::redact_text，contract test 直接构造）
  - phase 合同：0.145.0 AgentMessageThreadItem.phase（commentary|final_answer|null）直接映射显式枚举；缺省→Unknown + PhaseMissing 诊断，投影层（M1-01）按 turn 边界保守归类
