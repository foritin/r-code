decisions:
  - request_key = "{run_id}:{item_id}"；答案通道按 task→run→request_key 三级路由，与 steer 同生命周期
  - 原子 claim：pending 槽 capacity=1 的 mpsc——重复/迟到提交在路由层拒绝，一个请求只有一次 writer 响应
  - 取消编码冻结：用户取消与超时都返回 result {answers:{}}（§4.3 允许的空答案）；serverRequest/resolved 与 run 取消返回 -32600 协议错误
  - schema 严格化：缺 questions/重复问题 ID/超限 → -32602 立即拒绝（fail-closed）；这同时是旧 -32601 行为的语义等价替代（既有 approval-pending 回归测试因此恢复通过）
  - secret：答案只存在于内存通道与单次 writer 响应；事件流只带 is_secret 标志，pending 不落 JSONL（恢复标记属 M3-03）
  - 等待期间 idle watchdog 不误杀：in_flight 非空沿用审批豁免；等待上限 = autoResolutionMs 或 20min 默认（M3-03 统一调度接管）
  - 未知 server request 仍返回 -32601（未触碰 handle_codex_app_server_request 的未知分支）

