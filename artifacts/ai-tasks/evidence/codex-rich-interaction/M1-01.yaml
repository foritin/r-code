decisions:
  - 投影器为纯状态机（无 I/O/时钟），e2e 与单测共用；CodexRunProjection 组合 normalizer+projector，主循环一份实例贯穿 run
  - phase 语义：final_answer→SessionEvent::Message（作者层），commentary/unknown→R_CODE_INTERIM_EVENT（轻量过程层，与原生 interim 折叠共用事件类型）；history 重建因此与 live 折叠一致，无需 vendor 协议改动
  - 封口帧零长度/全文二分：streamed=true 发空文本封口（正文已按增量交付，重复正文禁令）；streamed=false（无增量一次性 completed/子代理路径）由封口帧携带全文
  - 权威 mismatch：投影器以全文替换累计并计数（mismatch_count），观察器路径直接写权威全文；live UI 的替换校正显示属 M1-03
  - 终态墓碑：sealed 后迟到增量丢弃计数（late_delta_count）；重复 completed 由 normalizer（DuplicateCompleted 诊断）+投影器（duplicate_seal_count）双层拦截
  - turn 结束/取消/失败统一在主循环收尾 finish_turn 冲刷残留 item（累计文本封口，unknown 保守归 commentary）
  - 不修改 AgentEvent DTO 与 vendor 协议：复用 Message{delta} 通道，A3 回归因此全绿

