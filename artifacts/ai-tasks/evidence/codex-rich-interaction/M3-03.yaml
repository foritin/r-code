decisions:
  - 恢复标记协议：System{codex_pending_question}（request_key/run_id/item_id/questions/state）；同 request_key 终态标记就地合并（单条、位置取首见）；secret 只有问题与标志，答案值永不落盘
  - 过期裁决在读取层：session_messages_for_task 按注册表 run 存活把 pending 改标 expired——transport/app 重启（注册表清空）天然全部过期；恢复的 pending 不是原 JSON-RPC 请求（§4.4 不伪恢复）
  - run 结束后的迟到提交：收尾 drain 任务持续 reject 到 sender 释放——提交方永远得到明确 Rejected 而非通道关闭错误
  - autoResolutionMs 用 tokio 单调时钟 sleep；用户提交与超时经同一 select，单胜者（M3-01 原子 claim 兜底）
  - steer 与答案提交物理分离（不同 channel 不同 select 分支）；a2 e2e 验证 pending 期间 steer 正常且顺序可追踪
  - parse_page_messages/session_messages_for_task async 化（读取层需查注册表）；既有 reasoning-visibility 测试同步加 .await

