decisions:
  - 不写 Plan store：问题卡是 TimelineItem 的独立 kind，与 Plan 状态机零耦合（§2 决策 9）
  - 答案编码：encodeUserInputAnswers 产出 {qid: [选项label…, 自由文本]}（§4.3 多答案数组）；secret 单输入取文本值
  - secret 防回显：密码框 + answered 摘要固定“已安全提交”；reducer 序列化断言不含原值
  - delivered 后本地即时 answered（避免等后端 resolved 的窗口期可重复点击）——后端原子 claim 兜底，resolved 事件幂等确认
  - 键盘可达性用原生表单控件构造（checkbox/text/password/button + fieldset/legend），aria-live 播报状态，错误 role=alert
  - 不抢编辑器焦点：requested 是纯数据事件，卡片无 autofocus

