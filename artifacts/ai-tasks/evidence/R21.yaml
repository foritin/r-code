decisions:
  - DM117: 裸 RN 而非 Expo prebuild（任务卡默认；自管签名/无云依赖）。
  - DM118: TS core 不搬家——mobile 经 metro watchFolders 直接引用 src-tauri/frontend/src/remote/core（monorepo 内共享，避免拷贝漂移）；"packages/remote-core 独立包"推迟到 R27 发布需求出现时。
  - DM119: 【本轮修正】CI 的真实可达成产物 = **两平台 metro bundle**（JS 层构建证据），
    不是 APK/IPA。APK/IPA 需 Android SDK / Xcode + 签名，明确归
    production_release_ready 外部放行；job 名不再叫 "debug build" 以免暗示不存在的产物。
  - DM137: 【本轮修复】workflow 注释必须是 `#`——`//` 让整个文件无法解析，
    这类"文件存在即通过"的静态守卫没有证伪能力，是虚假映射的温床；
    守卫改为主动检测 JS 风格注释行与 exit-0 占位。
  - DM138: 【本轮修复】transport.ts 去掉 DOM 依赖，改由平台注入 socket 工厂。
    根因：RN 的 WebSocket 没有 addEventListener（初版直连 DOM API，在真机必崩），
    且该文件被 RN 的 tsc 拉进编译图后暴露一堆 DOM 类型错误。
    PWA 侧新增 dom-socket.ts，RN 侧新增 rn-socket.ts；帧协议/命令语义零重复。
  - DM139: 【本轮修复】RN 命令帧的 client_id 用 deviceId（原来沿用了写死的 "pwa"）。
    F6 要求 daemon 按 client_id 强制能力，发错身份会让 RN 被当作 PWA 设备。
    PWA 侧仍默认 "pwa" 以保持既有行为。
  - DM140: 【本轮修复】RemoteConnection.connect 的阶段判断改用显式 streaming 标志。
    重构时曾用"帧处理器是否已挂上"来判断，导致 welcome 帧被当成常规帧丢弃
    （常规帧只认 command_id / 事件数组），连接永远等不到握手——由新增的
    transport-hello 测试抓出。
