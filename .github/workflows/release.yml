name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要创建或更新的版本标签（例如 v0.1.0）"
        required: true
        type: string
      finalize_only:
        description: "复用现有完整草稿资产，仅重新生成清单并发布"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      windows_signed: ${{ steps.release-mode.outputs.windows_signed }}
      apple_signed: ${{ steps.release-mode.outputs.apple_signed }}
      prerelease: ${{ steps.release-type.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Require the default branch for manual releases
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [[ "$DISPATCH_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            printf '::error::Manual releases must run from refs/heads/%s, not %s\n' "$DEFAULT_BRANCH" "$DISPATCH_REF"
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      - name: Verify tag, versions and changelog
        run: node scripts/release.mjs check "$RELEASE_TAG"

      - name: Detect prerelease tag
        id: release-type
        shell: bash
        run: |
          # 发布通道完全由 tag 决定：vX.Y.Z 一律是 stable 并标记为 Latest；
          # 只有显式 -unsigned.N 才作为 prerelease（不进入 Latest / 稳定更新通道）。
          if [[ "$RELEASE_TAG" == *-unsigned.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify immutable tag provenance and CI quality gate
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{}")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            printf '::error::Release tag %s (%s) is not reachable from origin/%s\n' "$RELEASE_TAG" "$tag_commit" "$DEFAULT_BRANCH"
            exit 1
          fi

          quality_dir="$RUNNER_TEMP/release-quality-gate"
          mkdir -p "$quality_dir"
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GH_REPO/actions/workflows/ci.yml/runs?event=push&status=completed&head_sha=$tag_commit&per_page=100" \
            > "$quality_dir/ci-runs.json"
          ci_run_id="$(node scripts/verify-release-quality-gate.mjs select \
            --runs "$quality_dir/ci-runs.json" \
            --tag-commit "$tag_commit" \
            --default-branch "$DEFAULT_BRANCH")"
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GH_REPO/actions/runs/$ci_run_id/jobs?per_page=100" \
            > "$quality_dir/ci-jobs.json"
          node scripts/verify-release-quality-gate.mjs verify-jobs \
            --jobs "$quality_dir/ci-jobs.json"

      - name: Select platform signing mode
        id: release-mode
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FINALIZE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.finalize_only || false }}
        run: |
          if [[ "$FINALIZE_ONLY" == "true" ]]; then
            echo "windows_signed=false" >> "$GITHUB_OUTPUT"
            echo "apple_signed=false" >> "$GITHUB_OUTPUT"
            echo "Finalize-only recovery conservatively preserves unsigned platform warnings."
            exit 0
          fi

          if [[ "$RELEASE_TAG" == *-unsigned.* ]]; then
            echo "windows_signed=false" >> "$GITHUB_OUTPUT"
            echo "apple_signed=false" >> "$GITHUB_OUTPUT"
            echo "Unsigned prerelease credentials are configured. Platform code signing is intentionally disabled."
            exit 0
          fi

          windows_required=(WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD WINDOWS_TIMESTAMP_URL)
          apple_required=(APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID)
          missing_windows=()
          missing_apple=()
          for name in "${windows_required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing_windows+=("$name"); fi
          done
          for name in "${apple_required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing_apple+=("$name"); fi
          done

          if (( ${#missing_windows[@]} == 0 )); then
            echo "windows_signed=true" >> "$GITHUB_OUTPUT"
            echo "Windows Authenticode signing is enabled."
          else
            echo "windows_signed=false" >> "$GITHUB_OUTPUT"
            printf '::warning title=Unsigned Windows artifacts::Missing %s. The stable release will continue and clearly warn users.\n' "${missing_windows[*]}"
          fi
          if (( ${#missing_apple[@]} == 0 )); then
            echo "apple_signed=true" >> "$GITHUB_OUTPUT"
            echo "Apple Developer ID signing and notarization are enabled."
          else
            echo "apple_signed=false" >> "$GITHUB_OUTPUT"
            printf '::warning title=Ad-hoc macOS artifacts::Missing %s. The stable release will continue and clearly warn users.\n' "${missing_apple[*]}"
          fi

  release-prerequisites:
    name: Verify release integrity credentials
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require release secrets used by later privileged jobs
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          required=(PAT_TOKEN TAURI_SIGNING_PRIVATE_KEY)
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required release secrets: %s\n' "${missing[*]}"
            exit 1
          fi

  supply-chain:
    name: Generate SBOM and license inventory
    needs: [validate, release-prerequisites]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Generate and validate dependency disclosures
        run: node scripts/generate-supply-chain.mjs target/supply-chain --strict

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-code-supply-chain
          path: |
            target/supply-chain/r-code-sbom.cdx.json
            target/supply-chain/THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}
    needs: [validate, release-prerequisites]
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.finalize_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            args: "--bundles nsis,msi"
            signed_config: "--config tauri.release-windows.conf.json"
            # Two localized MSI bundles currently collide on tauri-action's generated
            # workflow-artifact name. Release assets are still uploaded to the draft.
            upload_workflow_artifacts: false
            rust-target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-latest
            # beforeBundleCommand 钩子在编译后、打包拷贝前给 plan_eval 签名
            #（嵌套 cargo [[bin]] 未签名会让 x86_64 codesign 确定性失败）。
            args: "--bundles app,dmg --config tauri.presign-macos.conf.json"
            upload_workflow_artifacts: true
            rust-target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            args: "--bundles app,dmg --config tauri.presign-macos.conf.json"
            upload_workflow_artifacts: true
            rust-target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-22.04
            args: "--bundles appimage,deb"
            upload_workflow_artifacts: true
            rust-target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src-tauri/frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Validate and import Windows Authenticode certificate
        if: matrix.platform == 'windows-x64' && needs.validate.outputs.windows_signed == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $missing = @("WINDOWS_CERTIFICATE", "WINDOWS_CERTIFICATE_PASSWORD", "WINDOWS_TIMESTAMP_URL") |
            Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "env:$_" -ErrorAction SilentlyContinue).Value) }
          if ($missing.Count -gt 0) { throw "Missing required Windows release secrets: $($missing -join ', ')" }

          $encodedPath = Join-Path $env:RUNNER_TEMP "r-code-authenticode.txt"
          $pfxPath = Join-Path $env:RUNNER_TEMP "r-code-authenticode.pfx"
          Set-Content -LiteralPath $encodedPath -Value $env:WINDOWS_CERTIFICATE -NoNewline
          certutil -decode $encodedPath $pfxPath | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Unable to decode WINDOWS_CERTIFICATE" }
          Remove-Item -LiteralPath $encodedPath -Force

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $certificate) { throw "Imported Authenticode certificate has no private key" }
          "WINDOWS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "src-tauri/tauri.release-windows.conf.json" -Encoding utf8

      # M8-04（R-DST-01）：externalBin 需要真实 r-code-tui 产物先于 Tauri 打包
      # 就位（build.rs 的占位文件只服务本地存在性检查，发布前必须覆盖）。
      - name: Build r-code-tui CLI for bundling
        shell: bash
        run: |
          cargo build --release -p r-code-tui --bin r-code-tui --target ${{ matrix.rust-target }}
          mkdir -p src-tauri/binaries
          cp "target/${{ matrix.rust-target }}/release/r-code-tui$( [[ '${{ matrix.platform }}' == windows-* ]] && echo '.exe' )"              "src-tauri/binaries/r-code-tui-${{ matrix.rust-target }}$( [[ '${{ matrix.platform }}' == windows-* ]] && echo '.exe' )"
          ls -la src-tauri/binaries/

      - name: Validate Apple signing and notarization secrets
        if: startsWith(matrix.platform, 'macos-') && needs.validate.outputs.apple_signed == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.platform, 'macos-') && needs.validate.outputs.apple_signed == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/r-code-developer-id.p12"
          keychain_path="$RUNNER_TEMP/r-code-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

      # Keep platform-signed and fallback environments separate. Empty Apple notarization
      # variables still opt Tauri into notarization, so ad-hoc macOS builds must not export them.
      - name: Build and publish platform-signed artifacts
        if: >-
          (matrix.platform == 'windows-x64' && needs.validate.outputs.windows_signed == 'true') ||
          (startsWith(matrix.platform, 'macos-') && needs.validate.outputs.apple_signed == 'true')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.args }} ${{ matrix.signed_config }} --target ${{ matrix.rust-target }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: R-Code ${{ env.RELEASE_TAG }}
          generateReleaseNotes: true
          # All matrix jobs upload into one draft. The finalize job publishes only
          # after every platform has succeeded, so a partial release is never latest.
          releaseDraft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          # Each matrix job uploads only its updater payload and signature. The single finalize
          # job builds latest.json after all platforms finish, avoiding concurrent read/overwrite.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: ${{ matrix.upload_workflow_artifacts }}

      - name: Build and publish unsigned or Linux artifacts
        if: >-
          matrix.platform == 'linux-x64' ||
          (matrix.platform == 'windows-x64' && needs.validate.outputs.windows_signed != 'true') ||
          (startsWith(matrix.platform, 'macos-') && needs.validate.outputs.apple_signed != 'true')
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS requires a signature to package the app. `-` is the local ad-hoc identity and
          # does not need a Developer ID certificate. Notarization variables are omitted above.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.args }} --target ${{ matrix.rust-target }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ contains(env.RELEASE_TAG, '-unsigned.') && format('R-Code {0} (unsigned prerelease)', env.RELEASE_TAG) || format('R-Code {0}', env.RELEASE_TAG) }}
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: ${{ matrix.upload_workflow_artifacts }}

      - name: Verify signed and notarized macOS bundles
        if: startsWith(matrix.platform, 'macos-') && needs.validate.outputs.apple_signed == 'true'
        shell: bash
        run: |
          bundle_root="target/${{ matrix.rust-target }}/release/bundle"
          shopt -s nullglob
          apps=("$bundle_root/macos/"*.app)
          dmgs=("$bundle_root/dmg/"*.dmg)
          [[ ${#apps[@]} -eq 1 && ${#dmgs[@]} -eq 1 ]]
          app_path="${apps[0]}"
          dmg_path="${dmgs[0]}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Build branded Windows installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./scripts/build-branded-installer.ps1 -SkipInnerBuild -Target ${{ matrix.rust-target }}

      - name: Sign and verify Windows release artifacts
        if: matrix.platform == 'windows-x64' && needs.validate.outputs.windows_signed == 'true'
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $signTool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signTool) {
            $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
            $signTool = Get-ChildItem -LiteralPath $kitsRoot -Filter signtool.exe -File -Recurse |
              Where-Object { $_.DirectoryName -match '\\x64$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signTool) { throw "signtool.exe was not found" }

          $bundleRoot = "target/${{ matrix.rust-target }}/release/bundle"
          $branded = @(Get-ChildItem "$bundleRoot/branded" -Filter "R-Code_*-installer.exe" -File)
          if ($branded.Count -ne 1) { throw "Expected one branded installer, found $($branded.Count)" }
          & $signTool sign /sha1 $env:WINDOWS_SIGNING_THUMBPRINT /fd SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /td SHA256 /d "R-Code" $branded[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($branded[0].Name)" }

          $artifacts = @($branded) + @(
            Get-ChildItem "$bundleRoot/nsis", "$bundleRoot/msi" -Include *.exe, *.msi -File -Recurse
          )
          if ($artifacts.Count -lt 3) { throw "Expected branded, NSIS and MSI artifacts before signature verification" }
          foreach ($artifact in $artifacts) {
            & $signTool verify /pa /all /v $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($artifact.Name)" }
          }

      - name: Upload branded Windows installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "target/${{ matrix.rust-target }}/release/bundle/branded" -Filter "R-Code_*-installer.exe" -File
          if ($installer.Count -ne 1) { throw "Expected one branded installer, found $($installer.Count)" }
          gh release upload "$env:RELEASE_TAG" $installer[0].FullName --clobber

      - name: Remove temporary Apple signing keychain
        if: always() && startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/r-code-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/r-code-developer-id.p12"

      - name: Remove temporary Windows certificate material
        if: always() && matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP\r-code-authenticode.pfx" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "src-tauri\tauri.release-windows.conf.json" -Force -ErrorAction SilentlyContinue

  finalize:
    name: Publish completed release
    needs: [validate, build, supply-chain]
    if: >-
      always() &&
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.supply-chain.result == 'success' &&
      (
        needs.build.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.finalize_only && needs.build.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PRERELEASE: ${{ needs.validate.outputs.prerelease }}
      WINDOWS_SIGNED: ${{ needs.validate.outputs.windows_signed }}
      APPLE_SIGNED: ${{ needs.validate.outputs.apple_signed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Manual recovery deliberately uses the reviewed workflow tooling from
          # the selected branch while every product/SBOM input remains pinned to the tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: r-code-supply-chain
          path: ${{ runner.temp }}/supply-chain

      - name: Verify updater manifest and publish draft
        run: |
          mkdir -p "$RUNNER_TEMP/release-manifest"
          gh release download "$RELEASE_TAG" --pattern '*.sig' --dir "$RUNNER_TEMP/release-manifest"
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          export TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{}")"
          gh release view "$RELEASE_TAG" --json assets,isDraft,tagName,targetCommitish > "$RUNNER_TEMP/release-manifest/release.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import { parseReleaseTag } from "./scripts/release.mjs";
            import { createUpdaterManifest, requiredReleaseAssets, validateUpdaterManifest } from "./scripts/publish-release.mjs";
            const release = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            const tagInfo = parseReleaseTag(process.env.RELEASE_TAG);
            if (!tagInfo) throw new Error(`invalid release tag ${process.env.RELEASE_TAG}`);
            if (release.tagName !== process.env.RELEASE_TAG) {
              throw new Error(`release tag is ${release.tagName ?? "<missing>"}`);
            }
            if (!release.isDraft) throw new Error("release must remain a draft until finalization");
            if (release.targetCommitish !== process.env.TAG_COMMIT) {
              throw new Error(`draft release target ${release.targetCommitish ?? "<missing>"} does not match tag commit ${process.env.TAG_COMMIT}`);
            }
            const generatedAssets = new Set([
              "latest.json",
              "r-code-sbom.cdx.json",
              "THIRD_PARTY_LICENSES.md",
            ]);
            const availableAssets = new Map(release.assets.map((asset) => [asset.name, asset]));
            if (availableAssets.size !== release.assets.length) {
              throw new Error("draft release contains duplicate asset names");
            }
            const missingAssets = requiredReleaseAssets(tagInfo.version)
              .filter((name) => !generatedAssets.has(name) && !availableAssets.has(name));
            if (missingAssets.length > 0) {
              throw new Error(`draft release is missing build assets: ${missingAssets.join(", ")}`);
            }
            const invalidAssets = requiredReleaseAssets(tagInfo.version)
              .filter((name) => !generatedAssets.has(name))
              .map((name) => availableAssets.get(name))
              .filter((asset) => asset.state !== "uploaded" || !Number.isSafeInteger(asset.size) || asset.size <= 0)
              .map((asset) => asset.name);
            if (invalidAssets.length > 0) {
              throw new Error(`draft release has incomplete build assets: ${invalidAssets.join(", ")}`);
            }
            const manifest = createUpdaterManifest({
              version: tagInfo.version,
              tag: process.env.RELEASE_TAG,
              repository: process.env.GH_REPO,
              releaseAssets: release.assets,
              signatureDirectory: process.argv[3],
            });
            const problems = validateUpdaterManifest(
              manifest,
              process.env.RELEASE_TAG,
              tagInfo,
              process.env.GH_REPO,
              release.assets,
              process.argv[3],
            );
            if (problems.length > 0) {
              throw new Error(`updater manifest validation failed:\n- ${problems.join("\n- ")}`);
            }
            fs.writeFileSync(process.argv[1], `${JSON.stringify(manifest, null, 2)}\n`);
          ' "$RUNNER_TEMP/release-manifest/latest.json" "$RUNNER_TEMP/release-manifest/release.json" "$RUNNER_TEMP/release-manifest"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-manifest/latest.json" \
            "$RUNNER_TEMP/supply-chain/r-code-sbom.cdx.json" \
            "$RUNNER_TEMP/supply-chain/THIRD_PARTY_LICENSES.md" \
            --clobber
          # Inline this version's CHANGELOG section into the release body so the notes
          # describe what changed instead of only linking the full changelog.
          version="${RELEASE_TAG#v}"
          changelog_section="$(node --input-type=module -e '
            import fs from "node:fs";
            const version = process.argv[1];
            const lines = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = lines.findIndex((line) => line.startsWith("## [" + version + "]"));
            if (start === -1) {
              process.stdout.write("");
            } else {
              let end = lines.findIndex((line, index) => index > start && line.startsWith("## ["));
              if (end === -1) end = lines.length;
              process.stdout.write(lines.slice(start + 1, end).join("\n").trim());
            }
          ' "$version")"
          if [[ "$RELEASE_TAG" == *-unsigned.* ]]; then
            notes_file="$RUNNER_TEMP/release-manifest/unsigned-release-notes.md"
            existing_body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            {
              printf '%s\n' '> [!WARNING]'
              printf '%s\n' '> **这是未签名预发布版本，仅用于测试。** Windows 会显示 SmartScreen 警告，macOS 会触发 Gatekeeper；请勿将其用于生产环境。'
              printf '%s\n' '> 此版本不会标记为 Latest，也不会进入正式自动更新通道。'
              printf '\n%s\n' "$existing_body"
            } > "$notes_file"
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease \
              --title "R-Code $RELEASE_TAG (unsigned prerelease)" \
              --notes-file "$notes_file" \
              --verify-tag
          elif [[ "$PRERELEASE" == "true" ]]; then
            notes_file="$RUNNER_TEMP/release-manifest/prerelease-notes.md"
            existing_body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            {
              printf '%s\n' '> [!IMPORTANT]'
              printf '%s\n' '> **这是 1.0 正式上线前的预上线版本。** 请先备份应用数据，并重点验证升级迁移、长会话、子代理与终端隔离。'
              printf '%s\n' '> 此版本不会标记为 Latest，也不会进入稳定版自动更新通道。'
              if [[ "$WINDOWS_SIGNED" != "true" || "$APPLE_SIGNED" != "true" ]]; then
                if [[ "$WINDOWS_SIGNED" != "true" && "$APPLE_SIGNED" != "true" ]]; then
                  platform_list="Windows、macOS"
                elif [[ "$WINDOWS_SIGNED" != "true" ]]; then
                  platform_list="Windows"
                else
                  platform_list="macOS"
                fi
                printf '%s\n' '<!-- RCODE_UNSIGNED_STABLE_WARNING -->'
                printf '%s\n' '> [!WARNING]'
                printf '%s\n' "> **此预上线版本包含未完成平台代码签名的安装包：$platform_list。** Windows 可能显示 SmartScreen 警告，macOS 可能触发 Gatekeeper。"
              fi
              if [[ -n "$changelog_section" ]]; then
                printf '\n%s\n' "$changelog_section"
              fi
              printf '\n%s\n' "$existing_body"
            } > "$notes_file"
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease \
              --title "R-Code $RELEASE_TAG (pre-release)" \
              --notes-file "$notes_file" \
              --verify-tag
          else
            if [[ "$WINDOWS_SIGNED" != "true" || "$APPLE_SIGNED" != "true" ]]; then
              notes_file="$RUNNER_TEMP/release-manifest/unsigned-stable-release-notes.md"
              existing_body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
              if [[ "$WINDOWS_SIGNED" != "true" && "$APPLE_SIGNED" != "true" ]]; then
                platform_list="Windows、macOS"
              elif [[ "$WINDOWS_SIGNED" != "true" ]]; then
                platform_list="Windows"
              else
                platform_list="macOS"
              fi
              if [[ "$existing_body" == *RCODE_UNSIGNED_STABLE_WARNING* ]]; then
                printf '%s\n' "$existing_body" > "$notes_file"
              else
                {
                  printf '%s\n' '<!-- RCODE_UNSIGNED_STABLE_WARNING -->'
                  printf '%s\n' '> [!WARNING]'
                  printf '%s\n' "> **此 Latest 版本包含未完成平台代码签名的安装包：$platform_list。**"
                  printf '%s\n' '> Windows 可能显示 SmartScreen 警告；macOS 可能触发 Gatekeeper。请仅从本仓库 Release 页面下载，并在安装前核对来源。'
                  printf '%s\n' '> Tauri updater 产物仍使用项目更新密钥签名并经过四平台清单校验。'
                  if [[ -n "$changelog_section" ]]; then
                    printf '\n%s\n' "$changelog_section"
                  fi
                  printf '\n%s\n' "$existing_body"
                } > "$notes_file"
              fi
              if [[ "$WINDOWS_SIGNED" != "true" && "$APPLE_SIGNED" != "true" ]]; then
                release_title="R-Code $RELEASE_TAG (unsigned build)"
              else
                release_title="R-Code $RELEASE_TAG (partially unsigned)"
              fi
              gh release edit "$RELEASE_TAG" \
                --draft=false \
                --latest \
                --title "$release_title" \
                --notes-file "$notes_file" \
                --verify-tag
            else
              if [[ -n "$changelog_section" ]]; then
                notes_file="$RUNNER_TEMP/release-manifest/stable-release-notes.md"
                {
                  printf '%s\n' "$changelog_section"
                  printf '\n%s\n' "$existing_body"
                } > "$notes_file"
                gh release edit "$RELEASE_TAG" --draft=false --latest --title "R-Code $RELEASE_TAG" --notes-file "$notes_file" --verify-tag
              else
                gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
              fi
            fi
          fi
