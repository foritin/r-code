name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要创建或更新的版本标签（例如 v0.1.0）"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag, versions and changelog
        run: node scripts/release.mjs check "$RELEASE_TAG"

      - name: Verify release credentials are configured
        shell: bash
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          required=(PAT_TOKEN TAURI_SIGNING_PRIVATE_KEY)
          if [[ "$RELEASE_TAG" != *-unsigned.* ]]; then
            required+=(
              WINDOWS_CERTIFICATE
              WINDOWS_CERTIFICATE_PASSWORD
              WINDOWS_TIMESTAMP_URL
              APPLE_CERTIFICATE
              APPLE_CERTIFICATE_PASSWORD
              APPLE_SIGNING_IDENTITY
              APPLE_ID
              APPLE_PASSWORD
              APPLE_TEAM_ID
            )
          fi

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required release secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ "$RELEASE_TAG" == *-unsigned.* ]]; then
            echo "Unsigned prerelease credentials are configured. Platform code signing is intentionally disabled."
          else
            echo "Signed release credentials are configured."
          fi

  supply-chain:
    name: Generate SBOM and license inventory
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Generate and validate dependency disclosures
        run: node scripts/generate-supply-chain.mjs target/supply-chain --strict

      - uses: actions/upload-artifact@v4
        with:
          name: r-code-supply-chain
          path: |
            target/supply-chain/r-code-sbom.cdx.json
            target/supply-chain/THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            args: "--bundles nsis,msi"
            signed_config: "--config tauri.release-windows.conf.json"
            rust-target: x86_64-pc-windows-msvc
          - platform: macos-arm64
            runner: macos-latest
            args: "--bundles app,dmg"
            rust-target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            args: "--bundles app,dmg"
            rust-target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-22.04
            args: "--bundles appimage,deb"
            rust-target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src-tauri/frontend
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Validate and import Windows Authenticode certificate
        if: matrix.platform == 'windows-x64' && !contains(env.RELEASE_TAG, '-unsigned.')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $missing = @("WINDOWS_CERTIFICATE", "WINDOWS_CERTIFICATE_PASSWORD", "WINDOWS_TIMESTAMP_URL") |
            Where-Object { [string]::IsNullOrWhiteSpace((Get-Item "env:$_" -ErrorAction SilentlyContinue).Value) }
          if ($missing.Count -gt 0) { throw "Missing required Windows release secrets: $($missing -join ', ')" }

          $encodedPath = Join-Path $env:RUNNER_TEMP "r-code-authenticode.txt"
          $pfxPath = Join-Path $env:RUNNER_TEMP "r-code-authenticode.pfx"
          Set-Content -LiteralPath $encodedPath -Value $env:WINDOWS_CERTIFICATE -NoNewline
          certutil -decode $encodedPath $pfxPath | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Unable to decode WINDOWS_CERTIFICATE" }
          Remove-Item -LiteralPath $encodedPath -Force

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $certificate = $certificates | Where-Object HasPrivateKey | Select-Object -First 1
          if (-not $certificate) { throw "Imported Authenticode certificate has no private key" }
          "WINDOWS_SIGNING_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $config = @{
            bundle = @{
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          }
          $config | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "src-tauri/tauri.release-windows.conf.json" -Encoding utf8

      - name: Validate Apple signing and notarization secrets
        if: startsWith(matrix.platform, 'macos-') && !contains(env.RELEASE_TAG, '-unsigned.')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required macOS release secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Import Apple Developer ID certificate
        if: startsWith(matrix.platform, 'macos-') && !contains(env.RELEASE_TAG, '-unsigned.')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/r-code-developer-id.p12"
          keychain_path="$RUNNER_TEMP/r-code-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

      # Keep signed and unsigned environments separate. Empty Apple notarization variables still
      # opt Tauri into notarization, so an unsigned prerelease must not export them at all.
      - name: Build and publish signed release
        if: "!contains(env.RELEASE_TAG, '-unsigned.')"
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.platform, 'macos-') && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.args }} ${{ matrix.signed_config }} --target ${{ matrix.rust-target }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: R-Code ${{ env.RELEASE_TAG }}
          generateReleaseNotes: true
          # All matrix jobs upload into one draft. The finalize job publishes only
          # after every platform has succeeded, so a partial release is never latest.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true

      - name: Build and publish unsigned prerelease
        if: contains(env.RELEASE_TAG, '-unsigned.')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS requires a signature to package the app. `-` is the local ad-hoc identity and
          # does not need a Developer ID certificate. Notarization variables are omitted above.
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
        with:
          projectPath: src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.args }} --target ${{ matrix.rust-target }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: R-Code ${{ env.RELEASE_TAG }} (unsigned prerelease)
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          uploadWorkflowArtifacts: true

      - name: Verify signed and notarized macOS bundles
        if: startsWith(matrix.platform, 'macos-') && !contains(env.RELEASE_TAG, '-unsigned.')
        shell: bash
        run: |
          bundle_root="target/${{ matrix.rust-target }}/release/bundle"
          shopt -s nullglob
          apps=("$bundle_root/macos/"*.app)
          dmgs=("$bundle_root/dmg/"*.dmg)
          [[ ${#apps[@]} -eq 1 && ${#dmgs[@]} -eq 1 ]]
          app_path="${apps[0]}"
          dmg_path="${dmgs[0]}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=4 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "$dmg_path"

      - name: Build branded Windows installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: ./scripts/build-branded-installer.ps1 -SkipInnerBuild -Target ${{ matrix.rust-target }}

      - name: Sign and verify Windows release artifacts
        if: matrix.platform == 'windows-x64' && !contains(env.RELEASE_TAG, '-unsigned.')
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $signTool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signTool) {
            $kitsRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
            $signTool = Get-ChildItem -LiteralPath $kitsRoot -Filter signtool.exe -File -Recurse |
              Where-Object { $_.DirectoryName -match '\\x64$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signTool) { throw "signtool.exe was not found" }

          $bundleRoot = "target/${{ matrix.rust-target }}/release/bundle"
          $branded = @(Get-ChildItem "$bundleRoot/branded" -Filter "R-Code_*-installer.exe" -File)
          if ($branded.Count -ne 1) { throw "Expected one branded installer, found $($branded.Count)" }
          & $signTool sign /sha1 $env:WINDOWS_SIGNING_THUMBPRINT /fd SHA256 /tr $env:WINDOWS_TIMESTAMP_URL /td SHA256 /d "R-Code" $branded[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed for $($branded[0].Name)" }

          $artifacts = @($branded) + @(
            Get-ChildItem "$bundleRoot/nsis", "$bundleRoot/msi" -Include *.exe, *.msi -File -Recurse
          )
          if ($artifacts.Count -lt 3) { throw "Expected branded, NSIS and MSI artifacts before signature verification" }
          foreach ($artifact in $artifacts) {
            & $signTool verify /pa /all /v $artifact.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($artifact.Name)" }
          }

      - name: Upload branded Windows installer
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "target/${{ matrix.rust-target }}/release/bundle/branded" -Filter "R-Code_*-installer.exe" -File
          if ($installer.Count -ne 1) { throw "Expected one branded installer, found $($installer.Count)" }
          gh release upload "$env:RELEASE_TAG" $installer[0].FullName --clobber

      - name: Remove temporary Apple signing keychain
        if: always() && startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/r-code-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/r-code-developer-id.p12"

      - name: Remove temporary Windows certificate material
        if: always() && matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          Remove-Item -LiteralPath "$env:RUNNER_TEMP\r-code-authenticode.pfx" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "src-tauri\tauri.release-windows.conf.json" -Force -ErrorAction SilentlyContinue

  finalize:
    name: Publish completed release
    needs: [build, supply-chain]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r-code-supply-chain
          path: ${{ runner.temp }}/supply-chain

      - name: Verify updater manifest and publish draft
        run: |
          mkdir -p "$RUNNER_TEMP/release-manifest"
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/release-manifest"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/supply-chain/r-code-sbom.cdx.json" \
            "$RUNNER_TEMP/supply-chain/THIRD_PARTY_LICENSES.md" \
            --clobber
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const expectedVersion = process.env.RELEASE_TAG
              .replace(/^v/, "")
              .replace(/-unsigned\.\d+$/, "");
            if (manifest.version !== expectedVersion && manifest.version !== process.env.RELEASE_TAG) {
              throw new Error(`latest.json version ${manifest.version} does not match ${process.env.RELEASE_TAG}`);
            }
            for (const platform of ["windows-x86_64", "darwin-aarch64", "darwin-x86_64", "linux-x86_64"]) {
              if (!manifest.platforms?.[platform]) throw new Error(`latest.json is missing ${platform}`);
            }
          ' "$RUNNER_TEMP/release-manifest/latest.json"
          if [[ "$RELEASE_TAG" == *-unsigned.* ]]; then
            notes_file="$RUNNER_TEMP/release-manifest/unsigned-release-notes.md"
            existing_body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            {
              printf '%s\n' '> [!WARNING]'
              printf '%s\n' '> **这是未签名预发布版本，仅用于测试。** Windows 会显示 SmartScreen 警告，macOS 会触发 Gatekeeper；请勿将其用于生产环境。'
              printf '%s\n' '> 此版本不会标记为 Latest，也不会进入正式自动更新通道。'
              printf '\n%s\n' "$existing_body"
            } > "$notes_file"
            gh release edit "$RELEASE_TAG" \
              --draft=false \
              --prerelease \
              --title "R-Code $RELEASE_TAG (unsigned prerelease)" \
              --notes-file "$notes_file" \
              --verify-tag
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
          fi
