name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend and Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json
      - name: Verify release metadata
        run: |
          node --test scripts/release.test.mjs
          node scripts/release.mjs check
      - name: Install frontend dependencies
        working-directory: src-tauri/frontend
        run: npm ci
      - name: Test frontend
        working-directory: src-tauri/frontend
        run: npm test
      - name: Build frontend
        working-directory: src-tauri/frontend
        run: npm run build

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GITHUB_TOKEN is scoped to this repository and cannot clone the
          # private agent-core submodule. PAT_TOKEN is a read-only fine-grained
          # token with Contents access to foritin/agent-core.
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: cargo audit
        run: cargo audit

  deny:
    name: Dependency Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: cargo deny check
        run: cargo deny check

  submodule-pin:
    name: Submodule Pin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
      # 比对的是「父仓记录的 gitlink」与「实际 checkout 出来的 HEAD」。
      #
      # 这里曾经拿 vendor/agent-core/contract-lock.json 里的 "commit" 去比 HEAD，
      # 那是个死循环：lock 文件本身就在子模块里，要它记录自己所在提交的 SHA 永远
      # 不可能成立——写 lock 会产生新提交，新提交的 SHA 又不等于 lock 里的值。
      # 这个 job 因此长期是红的。真正该验的是「子模块有没有被意外 checkout 到
      # 父仓指针以外的位置」，那就是下面这个比对。
      - name: Verify agent-core submodule pin
        run: |
          EXPECTED=$(git ls-tree HEAD vendor/agent-core | awk '{print $3}')
          ACTUAL=$(git -C vendor/agent-core rev-parse HEAD)
          echo "Expected (parent repo gitlink): $EXPECTED"
          echo "Actual   (submodule HEAD):      $ACTUAL"
          if [ -z "$EXPECTED" ]; then
            echo "ERROR: vendor/agent-core is not registered as a submodule in HEAD"
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: agent-core submodule commit mismatch!"
            echo "父仓指针与实际 checkout 不一致，通常是忘了 git add vendor/agent-core"
            exit 1
          fi
          echo "✅ Submodule pin verified"
