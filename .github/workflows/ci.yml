name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend and Release Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json
      - name: Verify release metadata
        run: |
          node --test scripts/release.test.mjs scripts/release-quality-gate.test.mjs scripts/flaky-test-report.test.mjs scripts/icon-assets.test.mjs
          node scripts/check-installer-frontend.mjs
          node scripts/release.mjs check
      - name: Install frontend dependencies
        working-directory: src-tauri/frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: src-tauri/frontend
        run: npx playwright-core install --with-deps chromium
      - name: Test frontend
        working-directory: src-tauri/frontend
        run: npm test
      - name: Build frontend
        working-directory: src-tauri/frontend
        run: npm run build

  npm-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json
      - name: Audit locked frontend dependencies
        working-directory: src-tauri/frontend
        env:
          # npm's public registry provides the advisory endpoint. This also keeps
          # the security gate independent of a developer's local mirror setting.
          npm_config_registry: https://registry.npmjs.org
        run: npm audit --package-lock-only --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed changes for verified secrets
        uses: trufflesecurity/trufflehog@0f58ae7c5036094a1e3e750d18772af92821b503 # v3.90.5
        with:
          # Scan the reachable history, not only the latest diff: a key removed
          # in a later commit is still exposed. Pin the Action and OCI image.
          base: ""
          head: ${{ github.sha }}
          version: 3.90.5@sha256:214da7bcbf60f71db229bc5b6d790bf46eb1e8d068faa59838c1dba59738bc85
          # Avoid false positives from intentionally fake credentials in tests.
          extra_args: --only-verified

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # GITHUB_TOKEN is scoped to this repository and cannot clone the
          # private agent-contracts submodule. PAT_TOKEN is a read-only fine-grained
          # token with Contents access to foritin/agent-contracts.
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          persist-credentials: false
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `src-tauri` declares `default = ["custom-protocol"]`, so clippy compiles the
      # production `generate_context!` branch and needs the frontend built first.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: src-tauri/frontend
        run: npm ci
      - name: Build frontend
        working-directory: src-tauri/frontend
        run: npm run build
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      # A platform-specific failure must not hide the result from the other
      # supported desktop platform.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          persist-credentials: false
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Windows 测试机只恢复不保存：Windows 的缓存保存约 3 分钟且内容与同矩阵其它
      # OS 腿相同（同 workspace/lockfile）；让 ubuntu 腿负责写、三条腿共享读。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.os != 'windows-latest'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: matrix.os == 'windows-latest'
        with:
          save-if: false
      # Keep the existing required job name while making its Windows leg prove the same frontend
      # contracts under the OS that hosts WebView2 and native companion coordinates.
      # `src-tauri` declares `default = ["custom-protocol"]`, so every `cargo test`/
      # `cargo clippy` build compiles the production `generate_context!` branch, which
      # embeds `frontendDist` and fails at compile time unless the frontend has been
      # built first. Build it on every platform; Playwright/npm test stay Windows-only.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: src-tauri/frontend
        run: npm ci
      - name: Build frontend
        working-directory: src-tauri/frontend
        run: npm run build
      - name: Install Playwright Chromium on Windows
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri/frontend
        run: npx playwright-core install chromium
      # Windows 只跑真实依赖宿主 OS 行为的浏览器契约（Windows 路径/OCR、companion
      # 混合 DPI 坐标、原生窗口语义）；其余 e2e 全量在 ubuntu 的 Frontend job 覆盖，
      # 不再整套重复（整套串行约 7 分钟，且慢 runner 上的时序 flaky 大多来自这里）。
      - name: Test Windows frontend (host-OS contracts)
        if: matrix.os == 'windows-latest'
        working-directory: src-tauri/frontend
        run: npm test -- app-shell.test.mjs companion-window-ui.test.mjs companion.test.mjs
      - name: cargo test
        # Several workspace integration suites share process-global fixtures.
        # Serial execution avoids platform-dependent false hangs under CI load.
        run: cargo test --workspace --all-features -- --test-threads=1

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-audit@0.22.2
      - name: cargo audit
        run: cargo audit

  deny:
    name: Dependency Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-deny
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny check

  submodule-pin:
    name: Submodule Pin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          persist-credentials: false
      # 比对的是「父仓记录的 gitlink」与「实际 checkout 出来的 HEAD」。
      #
      # 这里曾经拿 vendor/agent-contracts/contract-lock.json 里的 "commit" 去比 HEAD，
      # 那是个死循环：lock 文件本身就在子模块里，要它记录自己所在提交的 SHA 永远
      # 不可能成立——写 lock 会产生新提交，新提交的 SHA 又不等于 lock 里的值。
      # 这个 job 因此长期是红的。真正该验的是「子模块有没有被意外 checkout 到
      # 父仓指针以外的位置」，那就是下面这个比对。
      - name: Verify agent-contracts submodule pin
        run: |
          EXPECTED=$(git ls-tree HEAD vendor/agent-contracts | awk '{print $3}')
          ACTUAL=$(git -C vendor/agent-contracts rev-parse HEAD)
          echo "Expected (parent repo gitlink): $EXPECTED"
          echo "Actual   (submodule HEAD):      $ACTUAL"
          if [ -z "$EXPECTED" ]; then
            echo "ERROR: vendor/agent-contracts is not registered as a submodule in HEAD"
            exit 1
          fi
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: agent-contracts submodule commit mismatch!"
            echo "父仓指针与实际 checkout 不一致，通常是忘了 git add vendor/agent-contracts"
            exit 1
          fi
          echo "✅ Submodule pin verified"
