name: Flaky Test Report

on:
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, when GitHub's scheduled runner queue is busiest.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: flaky-test-report-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  frontend:
    name: Frontend repeated tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src-tauri/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: src-tauri/frontend
        run: npm ci
      - name: Verify flaky-test reporter
        run: node --test scripts/flaky-test-report.test.mjs
      - name: Repeat frontend test suite five times
        run: >-
          node scripts/flaky-test-report.mjs
          --name frontend
          --attempts 5
          --cwd src-tauri/frontend
          --timeout-ms 1200000
          -- npm test
      - name: Upload frontend report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flaky-report-frontend
          path: target/flaky-report
          if-no-files-found: ignore
          retention-days: 14

  rust:
    name: Rust repeated tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # The repository token cannot read the private agent-core submodule.
          token: ${{ secrets.PAT_TOKEN }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Repeat Rust workspace tests three times
        run: >-
          node scripts/flaky-test-report.mjs
          --name rust-${{ runner.os }}
          --attempts 3
          --timeout-ms 3600000
          -- cargo test --workspace --all-features
      - name: Upload Rust report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: flaky-report-rust-${{ runner.os }}
          path: target/flaky-report
          if-no-files-found: ignore
          retention-days: 14
