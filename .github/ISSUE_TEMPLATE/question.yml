name: Question
description: 询问安装、配置或使用方式
title: "[Question]: "
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        请勿在问题中粘贴 Provider/MCP 密钥、私有源码、真实对话或未经脱敏的 AppData 内容。安全问题请改用私密报告渠道。
  - type: textarea
    id: goal
    attributes:
      label: 你想完成什么
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: 已尝试的方法
      description: 包括相关设置、命令和已脱敏的错误信息。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: R-Code 版本、操作系统、安装或启动方式
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已阅读 README、SUPPORT 和相关专题文档。
          required: true
        - label: 我已删除凭据、私有源码和个人数据。
          required: true
        - label: 我同意遵守项目 Code of Conduct。
          required: true
