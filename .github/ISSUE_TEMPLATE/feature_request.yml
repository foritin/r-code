name: Feature request
description: 提议一个能解决明确用户问题的能力
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述当前用户遇到的阻力，以及它在什么场景下发生。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的交互、边界和成功标准，不要求先给出完整实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 包括当前变通方式，以及它为什么不够好。
  - type: dropdown
    id: area
    attributes:
      label: 主要影响范围
      options:
        - 对话与任务编排
        - Agent 与子智能体
        - 记忆、Prompt 与 Skill
        - MCP 与联网工具
        - 文件、审核与 Git
        - Provider 与 Codex CLI
        - 安装、更新与发布
        - 性能与稳定性
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 issue，未发现相同建议。
          required: true
        - label: 我同意遵守项目 Code of Conduct。
          required: true
