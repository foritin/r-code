name: Bug report
description: 报告可复现的 R-Code 缺陷
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞请使用 Security Policy 中的私密渠道，不要在这里附带密钥、私有源码、真实对话或 AppData 原始数据。
  - type: input
    id: version
    attributes:
      label: R-Code 版本
      description: 可在安装包、设置或 GitHub Release 中确认。
      placeholder: 例如 v0.1.0-unsigned.5
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: install-source
    attributes:
      label: 安装或启动方式
      placeholder: GitHub Release 安装器 / cargo tauri dev / 本地构建
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 从干净启动开始，按顺序列出稳定复现问题所需的最少操作。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的日志或补充信息
      description: 请删除密钥、用户名、私有绝对路径、项目源码、对话和个人数据。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 issue，未发现相同问题。
          required: true
        - label: 我已删除日志和截图中的凭据、私有源码及个人数据。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
        - label: 我同意遵守项目 Code of Conduct。
          required: true
