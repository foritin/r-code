# fix-plan-2026-08-29 — 阶段A->B 汇总门禁产出
# 合并原则：根因相同的 findings 归并为一个修复任务；修复消除根因类别而非症状点。
# 状态只允许 pending -> in_progress -> done 流转；evidence 归档到 evidence/ 下。

branch: feat/code-review-2026-08-29
baseline_tests:
  cargo: docs/code-review-2026-08-29/evidence/baseline-cargo-test.log
  frontend: docs/code-review-2026-08-29/evidence/baseline-frontend-test.log

tasks:
  - id: FX-00
    title: 用户 WIP 资产保全提交
    status: done
    depends_on: []
    findings: []            # 流程前置，非修复
    steps:
      - 将本次任务开始前的全部未提交改动（24 modified + 14 untracked，清单见 evidence/phase0-git-status.txt）以单独 wip: 提交入库
      - 目的：使后续修复提交可干净 diff；不 reset/覆盖/回滚/删除任何内容
    acceptance:
      - "git status --porcelain 输出中不再有 stage 前遗留（review 文档除外）"
    evidence: docs/code-review-2026-08-29/evidence/FX-00-wip-commit.txt

  - id: FX-01
    title: 统一进程树终止原语并补齐 codex wrapper 路径（blocking）
    status: done
    depends_on: [FX-00]
    findings: [F-robust-01, F-robust-02, F-robust-03, F-maint-01]
    root_cause: Windows 树杀知识三处独立实现（commands.rs terminate_codex_child / gateway tools_command / store verification），新进程路径各自写单 kill，无共享原语强制复用
    steps:
      - r-code-core 新增 process 模块：kill_tree(pid)（Windows taskkill /PID x /T /F；Unix 进程组语义）+ 单测
      - codex_app_server.rs / codex_mcp.rs shutdown 路径接 kill_tree（修 F-robust-01/02）
      - commands.rs 一次性 codex/npm CLI 超时路径改 take+drain+wait+select+kill_tree（修 F-robust-03，参照 tools_command 模板）
      - 三处旧实现替换为共享原语（修 F-maint-01 分叉）
      - 补测试：shutdown 后无 cmd wrapper 残留（Windows 集成测试）、超时分支杀树
    acceptance:
      - "cargo test -p r-code-core -p r-code-gateway -p r-code-store --all-features -- --test-threads=1"
      - "rg -n 'taskkill' --type rust 全仓命中收敛到 r-code-core 单一实现内（计数<=该实现内部出现次数）"
    evidence: docs/code-review-2026-08-29/evidence/FX-01-*.md

  - id: FX-02
    title: Codex 工具输出缓冲去 O(n²)（blocking）
    status: done
    depends_on: [FX-00]
    findings: [F-perf-01, F-perf-10]
    root_cause: 缓冲内存有界设计正确但用逐字符推进实现，计数与截断都是 O(len)/字符；测试只验证语义未验证耗时
    steps:
      - CodexToolOutputBuffer 增量维护 head/tail 字符计数；溢出用字节级 drain 一次截断（UTF-8 边界安全）
      - accumulate_tool_output 去掉每次调用即全量 render 丢弃的模式（render 按需）
      - 新增性能钉子测试（宽时间上限 + 语义保持既有 "big" 用例）
    acceptance:
      - "cargo test -p r-code-host --lib codex_interaction -- --test-threads=1"
      - "新增测试证明 1MB 输出 push 在宽松时限内完成且 head/tail 语义不变"
    evidence: docs/code-review-2026-08-29/evidence/FX-02-*.md

  - id: FX-03
    title: provider 请求管线深拷贝削减 + 子代理浓缩超时（blocking）
    status: done
    depends_on: [FX-00]
    findings: [F-perf-02, F-perf-11, F-perf-16, F-robust-05]
    root_cause: 请求构造所有权链按值传递；锁内做 O(历史) 深拷；journal 指纹双物化；vendor stream(complete) 接口吃所有权导致重试整份克隆（vendor 接口演进部分记遗留）
    steps:
      - sessions 全局锁内只做浅快照（Arc/引用收集），深拷移出锁外（F-perf-11）
      - dispatch_ref_messages 改为迭代器探测 attachment 引用、需要时才物化（F-perf-02 部分）
      - journal fingerprint 去 to_value->to_vec 双物化，改流式/拼接哈希（F-perf-16）
      - agent_loop attempt 循环：首轮 move、重试才从冻结请求克隆（F-perf-02 部分）
      - prepare_subagent_report 的 complete() 套 120s timeout，超时走既有 fallback_subagent_report（F-robust-05）
      - 行为钉子：llm_runtime_tests 既有全量回归
    acceptance:
      - "cargo test -p r-code-agent-worker --all-features -- --test-threads=1"
      - "rg 确认 dispatch_ref 无条件 clone / 锁内 messages.clone() 模式清零"
    evidence: docs/code-review-2026-08-29/evidence/FX-03-*.md

  - id: FX-04
    title: 后台任务监督 + panic 终态收敛 + 锁中毒降级（major）
    status: done
    depends_on: [FX-00]
    findings: [F-robust-06, F-robust-07, F-corr-02, F-corr-03, F-corr-04, F-corr-09]
    root_cause: fire-and-forget spawn 把 panic 当不可达；锁中毒视为不可达；无统一监督/降级策略
    steps:
      - drain loop 包 AssertUnwindSafe catch_unwind + finally 终态收敛（mark_run_aborted/Interrupted/bridge.active=None）
      - llm_runtime 运行主路径 13 处 lock().expect("poisoned") 改 poison 降级（into_inner 恢复 + warn 日志，可重建状态允许重建）
      - log_buffer 全局 BUFFER 与 host 侧 agent_event_sink/locale 等 lock().unwrap 家族同策略
      - 宿主 fire-and-forget spawn 统一 supervised helper（JoinError 记日志）
      - 测试：drain loop panic 注入 -> run 收敛终态；poison 注入 -> 后续调用不 panic
    acceptance:
      - "cargo test -p r-code-host -p r-code-agent-worker --all-features -- --test-threads=1（含新增测试）"
      - "rg -n 'expect\\(\".*poisoned\"\\)' --type rust 生产代码清零（llm_runtime 13 处 -> 0）"
    evidence: docs/code-review-2026-08-29/evidence/FX-04-*.md

  - id: FX-05
    title: 事件管线批处理/去重/借用化（major）
    status: done
    depends_on: [FX-00]
    findings: [F-perf-03, F-perf-04, F-perf-10, F-perf-15]
    root_cause: sink 单事件闭包签名 + 幂等防御无状态化 + 双出口 clone；批频率限制了但没减少消息条数/序列化次数
    steps:
      - ensure_session_log 会话粒度记忆化（HashSet 挂 drain 状态）
      - sink 增批接口：drain 循环合并同 task 连续 Message{delta} 为一条（文本拼接）；Envelope 借用直发去中间 Value
      - emit_codex_* 双出口 event.clone() -> 借用/Arc
      - codex params value.get("params").cloned() -> 借用读取
      - 测试：批合并语义（顺序/完整性）、既有 codex 流测试回归
    acceptance:
      - "cargo test -p r-code-host --all-features -- --test-threads=1（含新增）"
      - "rg 确认 persist_runtime_event 每事件 .exists() 模式清零"
    evidence: docs/code-review-2026-08-29/evidence/FX-05-*.md

