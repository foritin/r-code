  - id: FX-11
    title: IPC 结构化错误契约（major）
    status: deferred——177签名+前端联动为专项体量，设计已冻结
    depends_on: [FX-07]
    findings: [F-corr-07]
    root_cause: IPC 边界无结构化错误类型，ProductError 链在 Result<_, String> 拍平，前端只能启发式恢复
    steps:
      - 定义 CommandError（kind/code + message + source 链，impl Serialize + From<ProductError> + From<String> 兼容）
      - tauri command 签名迁移到 Result<T, CommandError>（薄包装层集中迁移 + commands.rs 内层返回值）
      - 前端 ipc.ts 错误规范化识别结构化对象（string 回退兼容）
      - 测试：错误链往返（后端 ProductError -> 前端收到 kind+根因文本）
    acceptance:
      - "cargo test -p r-code-host --all-features -- --test-threads=1 && node --test（ipc 相关前端测试）"
      - "新增测试断言前端可拿到结构化错误对象；既有错误提示文案不回退"
