    dimension: architecture
    status: done
    depends_on: [RV-01]
    steps:
      - 识别上帝模块（超长文件/函数）、职责越权、分层违规
      - 检查 src-tauri/src 内部模块间循环依赖与越层调用
      - 评估 crate 边界与实际代码组织的一致性
    acceptance:
      - "test -f docs/code-review-2026-08-29/findings/02-architecture-2026-08-29.md && [ $(grep -c '^| F-arch' docs/code-review-2026-08-29/findings/02-architecture-2026-08-29.md) -ge 3 ]"
