      - 审查错误传播策略一致性（anyhow vs thiserror vs String）
      - 审查并发正确性：std Mutex 跨 await、锁粒度、 poison 处理
    acceptance:
      - "test -f docs/code-review-2026-08-29/findings/03-correctness-2026-08-29.md && [ $(grep -c '^| F-corr' docs/code-review-2026-08-29/findings/03-correctness-2026-08-29.md) -ge 3 ]"
    evidence: docs/code-review-2026-08-29/evidence/RV-03-*.md

