      - 凭据（API key）存储、内存与日志泄漏审查
      - 前端 XSS 面（dangerouslySetInnerHTML 等）、IPC 权限配置
    acceptance:
      - "test -f docs/code-review-2026-08-29/findings/04-security-2026-08-29.md && [ $(grep -c '^| F-sec' docs/code-review-2026-08-29/findings/04-security-2026-08-29.md) -ge 3 ]"
