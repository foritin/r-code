<!doctype html>
<html lang="zh-CN" data-theme="obsidian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#151311">
  <meta name="description" content="R-Code Dark · 完整交互 Demo：R-Code 工作台的完整可点击 HTML 原型。">
  <title>R-Code Dark · 完整交互 Demo</title>
  <link rel="stylesheet" href="../../../demo/styles.css">
  <style>
  :root[data-theme="studio-light"] {
    --prototype-workspace-radius: 20px;
    --bg-app: #fbfaf7;
    --bg-sidebar: #f5f0ea;
    --bg-panel: #fffefc;
    --bg-card: #fffdf9;
    --bg-chip: #f3ede7;
    --bg-inset: #f6f1eb;
    --bg-hover: #f5eee7;
    --bg-active: #f0e7de;
    --border: #e7ded4;
    --border-strong: #d5c9bc;
    --prototype-sidebar: #f5f0ea;
    --prototype-sidebar-glow: rgba(191, 91, 73, .05);
    --prototype-link: #286a9f;
    --prototype-command: #8d837a;
    --prototype-user: #f1ece6;
  }

  :root[data-theme="obsidian"] {
    --prototype-workspace-radius: 20px;
    --bg-app: #151311;
    --bg-sidebar: #211d1e;
    --bg-panel: #1b1917;
    --bg-card: #211f1c;
    --bg-chip: #2b2725;
    --bg-inset: #100f0e;
    --bg-hover: #292622;
    --bg-active: #302c28;
    --border: #302e2a;
    --border-strong: #48423d;
    --prototype-sidebar: #211d1e;
    --prototype-sidebar-glow: rgba(106, 34, 50, .08);
    --prototype-link: #8bc3ff;
    --prototype-command: #8d8984;
    --prototype-user: #242321;
  }

  /* One continuous underlay is exposed by the sidebar, topbar, and workspace corner cutout. */
  #app.app-shell {
    background-color: var(--prototype-sidebar) !important;
    background-image: radial-gradient(
      48% 110% at 16% 10%,
      var(--prototype-sidebar-glow) 0%,
      transparent 72%
    ) !important;
  }

  #app .app-sidebar {
    background: transparent !important;
    border-right: 0 !important;
  }

  #app.app-shell .app-topbar {
    gap: 2px;
    padding-inline: 10px;
    border-bottom: 0 !important;
    background: transparent !important;
  }

  #app.app-shell .compact-search-toggle,
  #app.app-shell .top-action-help {
    display: none !important;
  }

  #app.app-shell .main {
    position: relative;
    z-index: 1;
    overflow: hidden;
    isolation: isolate;
    border-left: 1px solid var(--border) !important;
    border-top: 1px solid var(--border) !important;
    border-radius: var(--prototype-workspace-radius) 0 0 0;
    background: var(--bg-app);
  }

  .prototype-desktop-nav,
  .prototype-history-actions,
  .prototype-app-menus {
    display: flex;
    align-items: center;
  }

  .prototype-desktop-nav {
    align-self: stretch;
    gap: 8px;
    margin-left: 2px;
  }

  .prototype-history-actions,
  .prototype-app-menus {
    gap: 1px;
  }

  .prototype-desktop-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 30px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--fg-muted);
    font-size: 12px;
    line-height: 1;
    white-space: nowrap;
  }

  .prototype-desktop-button:hover,
  .prototype-desktop-button:focus-visible,
  .prototype-desktop-button[aria-expanded="true"] {
    background: color-mix(in srgb, var(--fg) 7%, transparent);
    color: var(--fg);
  }

  .prototype-desktop-button:disabled {
    opacity: .38;
  }

  .prototype-history-button {
    width: 30px;
    padding: 0;
  }

  .prototype-desktop-menu-popover {
    position: fixed;
    z-index: 520;
    min-width: 168px;
    padding: 5px;
    border: 1px solid var(--border-strong);
    border-radius: 9px;
    background: var(--bg-panel);
    box-shadow: var(--shadow-popover);
  }

  .prototype-desktop-menu-item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 29px;
    padding: 0 9px;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--fg);
    font-size: 12px;
    text-align: left;
  }

  .prototype-desktop-menu-item:hover,
  .prototype-desktop-menu-item:focus-visible {
    background: var(--bg-hover);
  }

  #app.scene-room .room-scopebar {
    display: none !important;
  }

  #app.scene-room .convo,
  #app.scene-room .workbench {
    border-right: 0 !important;
    border-left: 0 !important;
  }

  #app.scene-room .room-splitter {
    background: transparent !important;
  }

  #app.scene-room .room-splitter::before,
  #app.scene-room .room-splitter:hover::before,
  #app.scene-room .room-splitter:focus-visible::before {
    top: 0 !important;
    bottom: 0 !important;
    width: 1px !important;
    background: var(--border) !important;
  }

  #app.scene-room .room-splitter:hover::before,
  #app.scene-room .room-splitter:focus-visible::before {
    background: var(--accent) !important;
  }

  #app.scene-room .room-splitter > span {
    display: none !important;
  }

  #app.scene-room .scene-room,
  #app.scene-room .convo,
  #app.scene-room .canvas,
  #app.scene-room .canvas-body,
  #app.scene-room .timeline,
  #app.scene-room .workbench,
  #app.scene-room .workbench-body,
  #app.scene-room .file-preview,
  #app.scene-room .file-code,
  #app.scene-room .file-code-editor {
    background: var(--bg-app) !important;
  }

  #app.scene-room .room-conversation-head,
  #app.scene-room .room-scopebar,
  #app.scene-room .canvas-tabs,
  #app.scene-room .workbench-head,
  #app.scene-room .chat-composer,
  #app.scene-room .room-archived-note {
    background: var(--bg-panel) !important;
  }

  #app.scene-room .comp-box,
  #app.scene-room .workbench-launcher-list,
  #app.scene-room .workbench-launcher-glyph,
  #app.scene-room .workbench-review-panel,
  #app.scene-room .workbench-review-rail-icon {
    background: var(--bg-card) !important;
  }

  .sidebar-task-actions,
  .conversation-row-actions > .menu-root,
  .room-task-actions,
  .task-actions-popover {
    display: none !important;
  }

  .sidebar-task-row.active:not(:hover):not(:focus-within) .sidebar-task time {
    opacity: 1 !important;
  }

  .prototype-row-actions {
    display: inline-flex;
    align-items: center;
    justify-content: flex-end;
    gap: 1px;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--dur-1) var(--ease);
  }

  .sidebar-task-row > .prototype-row-actions {
    position: absolute;
    z-index: 2;
    top: 1px;
    right: 2px;
    min-width: 58px;
  }

  .sidebar-task-row:hover > .prototype-row-actions,
  .sidebar-task-row:focus-within > .prototype-row-actions,
  .conversation-row:hover .prototype-row-actions,
  .conversation-row:focus-within .prototype-row-actions {
    opacity: 1;
    pointer-events: auto;
  }

  .sidebar-task-row:hover .sidebar-task time,
  .sidebar-task-row:focus-within .sidebar-task time {
    opacity: 0;
  }

  .prototype-action {
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--fg-muted);
  }

  .prototype-action:hover,
  .prototype-action:focus-visible {
    background: color-mix(in srgb, var(--fg) 8%, transparent);
    color: var(--fg);
  }

  .prototype-action[aria-pressed="true"] {
    color: var(--accent);
  }

  .prototype-pinned > .sidebar-task,
  .conversation-row.prototype-pinned {
    background: var(--bg-hover);
  }

  .conversation-row-actions .prototype-row-actions {
    min-width: 58px;
  }

  /* Main session stream: one reading column, not a stack of cards. */
  #app.scene-room .timeline {
    padding: 0 !important;
    scrollbar-gutter: stable;
  }

  #app.scene-room .convo > .activity-strip,
  #app.scene-room .convo > .subagent-panel,
  #app.scene-room .composer > .statusbar {
    display: none !important;
  }

  #app.scene-room .chat-composer {
    border-top: 0 !important;
    background: var(--bg-app) !important;
  }

  #app.scene-room .composer {
    padding: 8px 12px 12px;
  }

  #app.scene-room .comp-box {
    border-color: var(--border) !important;
    box-shadow: none !important;
  }

  .prototype-session {
    width: min(820px, calc(100% - 56px));
    margin: 0 auto;
    padding: 24px 0 36px;
    color: var(--fg);
  }

  .prototype-user-row {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 32px;
  }

  .prototype-user-message {
    max-width: min(72%, 620px);
    padding: 11px 16px 12px;
    border: 0;
    border-radius: 18px;
    background: var(--prototype-user);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.55;
    text-wrap: pretty;
  }

  .prototype-session-summary {
    display: flex;
    align-items: center;
    width: 100%;
    gap: 7px;
    padding: 0 0 12px;
    border: 0;
    border-bottom: 1px solid var(--border);
    border-radius: 0;
    background: transparent;
    color: var(--fg-muted);
    font-size: 13px;
    font-weight: 520;
    text-align: left;
  }

  .prototype-session-summary:hover {
    color: var(--fg);
  }

  .prototype-session-summary svg {
    transition: transform var(--dur-2) var(--ease);
  }

  .prototype-session-summary[aria-expanded="false"] svg {
    transform: rotate(-90deg);
  }

  .prototype-session-body {
    padding-top: 22px;
  }

  .prototype-assistant-copy {
    margin: 0 0 17px;
    color: var(--fg);
    font-size: 15px;
    font-weight: 440;
    line-height: 1.72;
    letter-spacing: .002em;
    text-wrap: pretty;
  }

  .prototype-command {
    display: grid;
    grid-template-columns: 22px minmax(0, 1fr);
    align-items: center;
    gap: 10px;
    min-width: 0;
    margin: 19px 0 20px;
    color: var(--prototype-command);
    font: 12px/1.55 var(--font-mono);
  }

  .prototype-command-icon {
    display: grid;
    place-items: center;
    width: 18px;
    height: 18px;
    border: 1px solid color-mix(in srgb, var(--prototype-command) 72%, transparent);
    border-radius: 5px;
  }

  .prototype-command code {
    min-width: 0;
    overflow: hidden;
    color: inherit;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .prototype-result-lead {
    margin-top: 24px;
    font-weight: 600;
  }

  .prototype-file-links {
    display: flex;
    align-items: flex-start;
    flex-direction: column;
    gap: 5px;
    margin: 10px 0 0;
  }

  .prototype-file-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    max-width: 100%;
    padding: 3px 0;
    color: var(--prototype-link);
    font-size: 13px;
    line-height: 1.45;
    text-decoration: none;
  }

  .prototype-file-link:hover,
  .prototype-file-link:focus-visible {
    color: color-mix(in srgb, var(--prototype-link) 82%, var(--fg));
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .prototype-file-link span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .prototype-completion {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 22px;
    padding-top: 13px;
    border-top: 1px solid var(--border);
  }

  .prototype-completion-state {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-right: auto;
    color: var(--success);
    font-size: 12px;
    font-weight: 560;
  }

  .prototype-completion-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 30px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--fg-muted);
    font-size: 12px;
    font-weight: 540;
  }

  .prototype-completion-action:hover,
  .prototype-completion-action:focus-visible {
    background: color-mix(in srgb, var(--fg) 7%, transparent);
    color: var(--fg);
  }

  .prototype-review-action,
  .prototype-review-action[aria-pressed="true"] {
    color: var(--prototype-link);
  }

  .prototype-session.is-undone .prototype-completion-state {
    color: var(--fg-muted);
  }

  .prototype-session.is-readonly .prototype-completion {
    display: none;
  }

  @media (max-width: 1359px) {
    .prototype-desktop-nav {
      gap: 4px;
    }

    .prototype-desktop-button {
      padding-inline: 6px;
    }

    .prototype-session {
      width: min(760px, calc(100% - 40px));
      padding-top: 20px;
    }

    .prototype-assistant-copy {
      font-size: 14px;
    }
  }


  #app.scene-room .scene-room.prototype-context-mode {
    grid-template-areas: "convo" !important;
    grid-template-columns: minmax(0, 1fr) !important;
  }

  #app.scene-room .scene-room.prototype-subagent-mode {
    grid-template-areas: "convo splitter canvas" !important;
    grid-template-columns: minmax(0, 55%) 8px minmax(0, 1fr) !important;
  }

  .prototype-original-panel {
    display: none !important;
  }

  .prototype-context-mode > .prototype-sidebar-host,
  .prototype-context-mode > .prototype-sidebar-splitter,
  .prototype-subagent-mode > .prototype-context-panel,
  .prototype-context-panel[hidden] {
    display: none !important;
  }

  .prototype-context-mode .prototype-session {
    width: min(760px, calc(100% - 420px));
    margin-right: auto;
    margin-left: clamp(36px, 7.2vw, 112px);
  }

  .prototype-context-mode .composer {
    padding-right: 372px !important;
  }

  .prototype-context-panel {
    position: absolute;
    z-index: 18;
    top: 76px;
    right: 16px;
    width: 344px;
    max-height: calc(100% - 96px);
    overflow: auto;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--bg-card);
    box-shadow: 0 12px 34px color-mix(in srgb, #000 18%, transparent);
    color: var(--fg);
  }

  .prototype-context-section {
    padding: 14px 16px;
  }

  .prototype-context-section + .prototype-context-section {
    border-top: 1px solid var(--border);
  }

  .prototype-context-heading,
  .prototype-agent-section-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 0 0 8px;
    color: var(--fg-muted);
    font-size: 12px;
    font-weight: 580;
    letter-spacing: .01em;
  }

  .prototype-context-count {
    color: var(--fg-faint);
    font-size: 11px;
    font-weight: 480;
  }

  .prototype-env-row {
    display: grid;
    grid-template-columns: 18px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    min-height: 29px;
    color: var(--fg);
    font-size: 12px;
  }

  .prototype-env-row svg,
  .prototype-source-row svg {
    color: var(--fg-muted);
  }

  .prototype-env-value {
    color: var(--fg-muted);
  }

  .prototype-diff-positive {
    color: var(--success);
  }

  .prototype-diff-negative {
    margin-left: 4px;
    color: var(--danger);
  }

  .prototype-context-subagents-button {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    width: 100%;
    min-height: 40px;
    gap: 9px;
    padding: 6px 8px;
    border: 0;
    border-radius: 9px;
    background: var(--bg-hover);
    color: var(--fg);
    text-align: left;
  }

  .prototype-context-subagents-button:hover,
  .prototype-context-subagents-button:focus-visible {
    background: var(--bg-active);
  }

  .prototype-agent-stack {
    display: flex;
    align-items: center;
    min-width: 42px;
  }

  .prototype-agent-stack .prototype-agent-avatar + .prototype-agent-avatar {
    margin-left: -7px;
  }

  .prototype-context-subagent-copy {
    min-width: 0;
  }

  .prototype-context-subagent-copy strong,
  .prototype-context-subagent-copy small {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .prototype-context-subagent-copy strong {
    font-size: 12px;
    font-weight: 580;
  }

  .prototype-context-subagent-copy small {
    margin-top: 1px;
    color: var(--fg-muted);
    font-size: 11px;
  }

  .prototype-source-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .prototype-source-row {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr);
    align-items: center;
    gap: 8px;
    min-height: 31px;
    padding: 3px 4px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--fg-muted);
    font-size: 11px;
    text-align: left;
  }

  .prototype-source-row:hover,
  .prototype-source-row:focus-visible {
    background: var(--bg-hover);
    color: var(--fg);
  }

  .prototype-source-kind {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg-inset);
    color: var(--fg-faint);
    font: 8px/1 var(--font-mono);
  }

  .prototype-source-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .prototype-sidebar-splitter {
    grid-area: splitter;
  }

  .prototype-sidebar-host {
    grid-area: canvas;
    min-width: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg-app) !important;
  }

  .prototype-agent-page {
    display: flex;
    flex-direction: column;
    min-height: 0;
    height: 100%;
  }

  .prototype-agent-page-header {
    display: flex;
    align-items: center;
    min-height: 48px;
    gap: 9px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-panel);
  }

  .prototype-agent-page-header.is-list {
    gap: 6px;
    padding-inline: 8px;
  }

  .prototype-agent-tab {
    display: flex;
    align-items: center;
    align-self: stretch;
    min-width: 134px;
    max-width: 220px;
    gap: 8px;
    padding: 0 5px 0 10px;
    border-bottom: 2px solid var(--accent);
    color: var(--fg);
  }

  .prototype-agent-tab .prototype-agent-avatar {
    width: 18px;
    height: 18px;
    border: 0;
    border-radius: 5px 5px 2px 5px;
    background: transparent;
    box-shadow: none;
  }

  .prototype-agent-tab-close {
    display: inline-grid;
    place-items: center;
    width: 25px;
    height: 25px;
    margin-left: auto;
    padding: 0;
    border: 0;
    border-radius: 5px;
    background: transparent;
    color: var(--fg-faint);
  }

  .prototype-agent-tab-close:hover,
  .prototype-agent-tab-close:focus-visible {
    background: var(--bg-hover);
    color: var(--fg);
  }

  .prototype-agent-page-header strong {
    min-width: 0;
    overflow: hidden;
    font-size: 13px;
    font-weight: 620;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .prototype-agent-header-spacer {
    flex: 1;
  }

  .prototype-agent-icon-button {
    display: inline-grid;
    place-items: center;
    width: 28px;
    height: 28px;
    padding: 0;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--fg-muted);
  }

  .prototype-agent-icon-button:hover,
  .prototype-agent-icon-button:focus-visible {
    background: var(--bg-hover);
    color: var(--fg);
  }

  .prototype-agent-list-body,
  .prototype-agent-detail-body {
    min-height: 0;
    overflow: auto;
  }

  .prototype-agent-list-body {
    padding: 20px 18px 28px;
  }

  .prototype-agent-list-section + .prototype-agent-list-section {
    margin-top: 26px;
  }

  .prototype-agent-list-section .prototype-agent-section-heading {
    justify-content: flex-start;
    min-height: 26px;
    margin: 0;
    padding: 0 8px 7px;
    font-size: 11px;
    letter-spacing: .04em;
  }

  .prototype-agent-row {
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr) auto;
    align-items: center;
    width: 100%;
    min-height: 68px;
    gap: 12px;
    padding: 9px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--fg);
    text-align: left;
  }

  .prototype-agent-row + .prototype-agent-row {
    border-top: 0;
  }

  .prototype-agent-row:hover,
  .prototype-agent-row:focus-visible {
    background: var(--bg-hover);
  }

  .prototype-agent-avatar {
    position: relative;
    display: inline-grid;
    place-items: center;
    width: 32px;
    height: 32px;
    flex: none;
    border: 1px solid color-mix(in srgb, var(--prototype-agent-color, var(--accent)) 72%, var(--border));
    border-radius: 9px 9px 3px 9px;
    background:
      radial-gradient(circle at 42% 38%, color-mix(in srgb, var(--prototype-agent-color, var(--accent)) 72%, white) 0 22%, transparent 23%),
      conic-gradient(from 22deg, var(--prototype-agent-color, var(--accent)), transparent 44%, var(--prototype-agent-color, var(--accent)) 76%, transparent);
    box-shadow: inset 0 0 0 4px color-mix(in srgb, var(--bg-card) 88%, transparent);
  }

  .prototype-agent-row .prototype-agent-avatar::after {
    content: "";
    position: absolute;
    right: -2px;
    bottom: -2px;

  <script>const installPrototypeDesktopChrome = async function installPrototypeDesktopChrome(page) {
  await page.evaluate(() => {
    const topbar = document.querySelector(".app-topbar");
    const sidebarToggle = topbar?.querySelector(".desktop-sidebar-toggle");
    if (!topbar || !sidebarToggle) return;

    const nativeNav = topbar.querySelector(".desktop-navigation");
    if (nativeNav) {
      topbar.querySelector(".prototype-desktop-nav")?.remove();
      document.documentElement.dataset.prototypeDesktopChrome = "native";
      return;
    }
    if (topbar.querySelector(".prototype-desktop-nav")) return;

    const backIcon = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m15 18-6-6 6-6"></path>
      </svg>`;
    const forwardIcon = `
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9 18 6-6-6-6"></path>
      </svg>`;
    const menuItems = {
      "文件": ["新建任务", "打开文件夹…", "关闭窗口"],
      "编辑": ["撤销", "重做", "查找"],
      "视图": ["切换左侧边栏", "打开审核面板", "重置缩放"],
      "帮助": ["快捷键", "查看文档", "关于 R-Code"],
    };

    const nav = document.createElement("nav");
    nav.className = "prototype-desktop-nav";
    nav.setAttribute("aria-label", "桌面导航");
    nav.innerHTML = `
      <div class="prototype-history-actions" aria-label="浏览历史">
        <button type="button" class="prototype-desktop-button prototype-history-button"
          data-prototype-history="back" aria-label="后退" title="后退">${backIcon}</button>
        <button type="button" class="prototype-desktop-button prototype-history-button"
          data-prototype-history="forward" aria-label="前进" title="前进" disabled>${forwardIcon}</button>
      </div>
      <div class="prototype-app-menus">
        ${Object.keys(menuItems).map((label) => `
          <button type="button" class="prototype-desktop-button prototype-menu-button"
            data-prototype-menu="${label}" aria-haspopup="menu" aria-expanded="false">${label}</button>
        `).join("")}
      </div>`;
    sidebarToggle.insertAdjacentElement("afterend", nav);

    const closeMenu = () => {
      document.querySelector(".prototype-desktop-menu-popover")?.remove();
      nav.querySelectorAll("[data-prototype-menu]").forEach((button) => {
        button.setAttribute("aria-expanded", "false");
      });
    };

    nav.querySelector('[data-prototype-history="back"]')?.addEventListener("click", () => {
      document.documentElement.dataset.prototypeHistoryAction = "back";
    });

    nav.querySelectorAll("[data-prototype-menu]").forEach((button) => {
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        const label = button.dataset.prototypeMenu || "";
        const wasOpen = button.getAttribute("aria-expanded") === "true";
        closeMenu();
        if (wasOpen) return;

        const popover = document.createElement("div");
        popover.className = "prototype-desktop-menu-popover";
        popover.setAttribute("role", "menu");
        popover.setAttribute("aria-label", `${label}菜单`);
        popover.innerHTML = (menuItems[label] || []).map((item) => `
          <button type="button" role="menuitem" class="prototype-desktop-menu-item">${item}</button>
        `).join("");
        const rect = button.getBoundingClientRect();
        popover.style.left = `${Math.round(rect.left)}px`;
        popover.style.top = `${Math.round(rect.bottom + 4)}px`;
        document.body.append(popover);
        button.setAttribute("aria-expanded", "true");
        popover.querySelectorAll("[role=menuitem]").forEach((item) => {
          item.addEventListener("click", closeMenu);
        });
      });
    });

    if (window.__prototypeDesktopOutsideHandler) {
      document.removeEventListener("pointerdown", window.__prototypeDesktopOutsideHandler);
    }
    window.__prototypeDesktopOutsideHandler = (event) => {
      if (!event.target.closest?.(".prototype-desktop-nav, .prototype-desktop-menu-popover")) closeMenu();
    };
    document.addEventListener("pointerdown", window.__prototypeDesktopOutsideHandler);

    if (window.__prototypeDesktopKeyHandler) {
      document.removeEventListener("keydown", window.__prototypeDesktopKeyHandler);
    }
    window.__prototypeDesktopKeyHandler = (event) => {
      if (event.key === "Escape") closeMenu();
    };
    document.addEventListener("keydown", window.__prototypeDesktopKeyHandler);
    document.documentElement.dataset.prototypeDesktopChrome = "true";
  });
};
const installPrototypeActions = async function installPrototypeActions(page) {
  await page.evaluate(() => {
    const pinSvg = `
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"

        <path d="M8 3v7a2 2 0 0 1-.6 1.4L5 14h14l-2.4-2.6A2 2 0 0 1 16 10V3"></path>
      </svg>`;
    const archiveSvg = `
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"

        <path d="M4 7h16"></path><path d="M5 7v12h14V7"></path><path d="M9 11h6"></path>
        <path d="M4 3h16v4H4z"></path>
      </svg>`;

    const rows = [...document.querySelectorAll(".sidebar-task-row, .conversation-row")];
    rows.forEach((row, index) => {
      if (row.querySelector(":scope > .prototype-row-actions, .conversation-row-actions > .prototype-row-actions")) return;
      row.dataset.prototypeOrder = row.dataset.prototypeOrder || String(index);

      const title = row.querySelector(".sidebar-task .rail-label, .conversation-main strong")?.textContent?.trim() || "当前对话";
      const originalTrigger = row.querySelector(".task-actions-trigger");
      if (!originalTrigger) return;

      [...document.querySelectorAll("[role='tab']")]
        .find((tab) => tab.textContent?.trim() === "已归档")?.click();
      const archivedRow = await waitFor(visibleConversationRow);
      (archivedRow.querySelector(".conversation-main") || archivedRow).click();
      const note = await waitFor(() => document.querySelector(".room-archived-note"));
      note.textContent = "此对话已归档，只能查看历史。";
      document.querySelector(".toast-close")?.click();
    }
  };

  const navigateToScenario = (id) => {
    const url = new URL(window.location.href);
    url.searchParams.set("demo", id);
    window.location.assign(url.href);
  };

  const installDemoNavigator = () => {
    if (new URL(window.location.href).searchParams.get("demoControls") === "0") return;
    if (document.querySelector(".prototype-demo-trigger")) return;
    const topbar = document.querySelector(".app-topbar");
    if (!topbar) return;

    const scenario = currentScenario();
    const trigger = document.createElement("button");
    trigger.type = "button";
    trigger.className = "prototype-demo-trigger";
    trigger.setAttribute("aria-expanded", "false");
    trigger.setAttribute("aria-controls", "prototype-demo-panel");
    trigger.innerHTML = `<strong>${scenario.number}</strong><span>原型场景</span><small>${scenarios.indexOf(scenario) + 1}/${scenarios.length}</small>`;

    const groups = [...new Set(scenarios.map((item) => item.group))];
    const panel = document.createElement("aside");
    panel.id = "prototype-demo-panel";
    panel.className = "prototype-demo-panel";
    panel.hidden = true;
    panel.setAttribute("aria-label", "原型场景导航");
    panel.innerHTML = `
      <header class="prototype-demo-panel-head">
        <div><strong>${config.title}</strong><small>${scenarios.length} 个真实状态；使用 [ 和 ] 快速切换。</small></div>
        <button type="button" class="prototype-demo-panel-close" aria-label="关闭场景导航">×</button>
      </header>
      <div class="prototype-demo-groups">
        ${groups.map((group) => `
          <section>
            <h3 class="prototype-demo-group-title">${group}</h3>
            ${scenarios.filter((item) => item.group === group).map((item) => `
              <button type="button" class="prototype-demo-scenario" data-demo-scenario="${item.id}" aria-current="${item.id === scenario.id}">
                <span class="prototype-demo-number">${item.number}</span><span>${item.label}</span><small>${item.id}</small>
              </button>`).join("")}
          </section>`).join("")}
      </div>
      <footer class="prototype-demo-panel-foot"><span>${config.variantLabel}</span><span>Esc 关闭</span></footer>`;

    const windowControls = topbar.querySelector(".app-window-controls");
    topbar.insertBefore(trigger, windowControls || null);
    document.body.append(panel);

    const setOpen = (open) => {
      panel.hidden = !open;
      trigger.setAttribute("aria-expanded", String(open));
      if (open) panel.querySelector(`[data-demo-scenario="${scenario.id}"]`)?.focus({ preventScroll: true });
    };
    trigger.addEventListener("click", () => setOpen(panel.hidden));
    panel.querySelector(".prototype-demo-panel-close")?.addEventListener("click", () => setOpen(false));
    panel.querySelectorAll("[data-demo-scenario]").forEach((button) => {
      button.addEventListener("click", () => navigateToScenario(button.dataset.demoScenario));
    });
    document.addEventListener("pointerdown", (event) => {
      if (!panel.hidden && !panel.contains(event.target) && !trigger.contains(event.target)) setOpen(false);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !panel.hidden) {
        setOpen(false);
        trigger.focus();
        return;
      }
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement || event.target?.isContentEditable) return;
      if (event.key !== "[" && event.key !== "]") return;
      const index = scenarios.indexOf(currentScenario());
      const direction = event.key === "]" ? 1 : -1;
      navigateToScenario(scenarios[(index + direction + scenarios.length) % scenarios.length].id);
    });
  };

  try {
    await waitFor(() => window.__ready === true && document.querySelector("#app"));
    await applyInstallers();
    installDemoNavigator();
    await prepareScenario();
    root.dataset.prototypeDemoReady = "true";

    let applyTimer = 0;
    const observer = new MutationObserver((records) => {
      if (!records.some((record) => record.type === "childList" && record.addedNodes.length)) return;
      window.clearTimeout(applyTimer);
      applyTimer = window.setTimeout(async () => {
        try {
          await applyInstallers();
          installDemoNavigator();
        } catch (error) {
          console.error("Failed to refresh prototype enhancements", error);
        }
      }, 40);
    });
    observer.observe(document.querySelector("#root") || document.body, { childList: true, subtree: true });
  } catch (error) {
    root.dataset.prototypeDemoReady = "error";
    console.error(error);
  }
})({
  config: window.__workbenchDemoConfig,
  scenarios: demoScenarios,
  installers: {
    desktop: installPrototypeDesktopChrome,
    actions: installPrototypeActions,
    conversation: installPrototypeConversation,
    activity: installPrototypeActivityExperience,
    resilience: installPrototypeResilienceExperience,
    sidebar: installPrototypeSidebarExperience,
    signature: async (page) => { await installSignatureDark(page); await installSignatureSanitizer(page); },
    settle: settlePrototype,
  },
});</script>
</body>
</html>
