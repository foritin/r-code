[package]
name = "r-code-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "R-Code terminal UI (session-first AI coding agent, terminal form)"

[[bin]]
name = "r-code-tui"
path = "src/main.rs"

[dependencies]
r-code-core = { path = "../r-code-core" }
r-code-store = { path = "../r-code-store" }
r-code-gateway = { path = "../r-code-gateway" }
r-code-agent-worker = { path = "../r-code-agent-worker" }
r-code-host = { path = "../../src-tauri" }

ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
agent-contract = { path = "../../vendor/agent-contracts/crates/agent-contract" }
agent-config = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
chrono = { workspace = true }
# G6 图片附件：base64 载荷 + 解码/缩放/半块预览（image 已随 tauri 编译，零新增包）。
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Globalization", "Win32_System_Console", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = { workspace = true }
portable-pty = { workspace = true }
