[package]
name = "r-code-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "R-Code 核心产品类型：DTO、状态机、错误类型"

[features]
default = []
testing = ["dep:tempfile"]

[dependencies]
# 公共合同
hermes-core = { workspace = true }
hermes-error = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 工具
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# 安全：平台凭据存储与日志脱敏 [doc-07 §5, §6]
regex = "1"
cap-std = "4.0.2"

# 可选：跨 crate 复用的测试 fixture。在启用 `testing` feature 时必须属于
# 通用依赖，不能落入任一平台专属 dependency table。
tempfile = { version = "3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows Credential Manager。缺失时 keyring 会回落到无法跨 Entry 持久化的 mock。
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(not(any(target_os = "windows", target_os = "macos")))'.dependencies]
# Linux 等平台保持现有系统凭据后端选择；macOS 明确不链接 keyring/Keychain。
keyring = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 使用应用数据目录中的 ChaCha20-Poly1305 加密凭据文件，不访问 Keychain。
base64 = { workspace = true }
libc = { workspace = true }
ring = { workspace = true }
tempfile = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
hermes-llm = { workspace = true }
hermes-store = { workspace = true }
hermes-config = { workspace = true }
hermes-compaction = { workspace = true }
hermes-mcp = { workspace = true }
