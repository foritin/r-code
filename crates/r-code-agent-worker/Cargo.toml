[package]
name = "r-code-agent-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "R-Code Agent Worker：Agent Runtime、agent loop、事件流"

[dependencies]
# 公共合同
agent-contract = { workspace = true }
agent-error = { workspace = true }
agent-llm = { workspace = true }
# 1.3（docs/harness-migration.md §1.3）：request/header 快照需要直接读写会话
# JSONL（SessionStore 的追加锁按进程内路径归一，支持多写方）。阶段 0.2 摘除的
# 是「零引用死依赖」；此处带真实调用方回归，与该结论不冲突。
agent-store = { workspace = true }

# 产品私有
r-code-core = { workspace = true }
r-code-gateway = { workspace = true }
r-code-mcp = { workspace = true }

# 异步
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 工具
blake3 = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# 1.3：RequestHeader 契约字段固定为 sha256 十六进制（跨工具链可对账，
# jq + sha256sum 即可复算），不用仓内既有的 fnv/blake3 指纹。
sha2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
